# Contract checks: lint, custom rules, example validation, bundle, and the Prism mock.
# The tool versions come from contracts/pnpm-lock.yaml. Every workflow follows the
# convention in docs/guides/repository-checks.md.
name: contracts

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-checks:
    name: contract-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pnpm version of contracts/package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          package_json_file: contracts/package.json
      - name: Set up the Node.js version of .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: contracts/pnpm-lock.yaml
      - name: Install the contract tools from the lockfile
        working-directory: contracts
        run: pnpm install --frozen-lockfile
      - name: Audit the contract tools for high and critical vulnerabilities (WF-31)
        working-directory: contracts
        run: pnpm audit --audit-level=high
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.11"
          enable-cache: false
      - name: Install pre-commit
        run: |
          uv tool install --python 3.12 pre-commit==4.7.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Lint the contracts and validate their examples
        run: pre-commit run contracts-check --all-files --show-diff-on-failure
      - name: Bundle the contracts
        working-directory: contracts
        run: pnpm run bundle
      - name: Check the sign-in flow and the example files through the Prism mock
        working-directory: contracts
        run: pnpm run check:mock
