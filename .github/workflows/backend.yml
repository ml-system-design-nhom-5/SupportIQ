# Backend checks: formatting, lint, strict types, layer boundaries, generated models, the
# dependency audit, the tests against PostgreSQL 17 with coverage, and the image build.
# Tool versions come from backend/uv.lock, Python from .python-version, and the hooks from the
# backend section of .pre-commit-config.yaml. Every workflow follows the convention in
# docs/guides/repository-checks.md.
name: backend

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: backend-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.11"
          enable-cache: false
      - name: Install pre-commit
        run: |
          uv tool install --python 3.12 pre-commit==4.7.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Install the Python of .python-version and the locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Check the formatting (ruff format)
        run: pre-commit run backend-format --all-files --show-diff-on-failure
      - name: Lint (ruff)
        run: pre-commit run backend-lint --all-files --show-diff-on-failure
      - name: Type-check in strict mode (pyright)
        run: pre-commit run backend-types --all-files --show-diff-on-failure
      - name: Check the layer and feature boundaries (import-linter)
        run: pre-commit run backend-imports --all-files --show-diff-on-failure
      - name: Check that the generated models match the contract (CON-26)
        run: pre-commit run backend-generated --all-files --show-diff-on-failure
      - name: Audit every locked dependency for known vulnerabilities (WF-31)
        working-directory: backend
        # pip-audit cannot audit the URL requirement of the named-entity model, so the export
        # leaves out that one package; its checksum in uv.lock protects it (ADR-0017, item 3).
        run: |
          uv export --locked --all-groups --no-emit-project --no-emit-package en-core-web-sm \
            --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uv run --locked pip-audit --strict --disable-pip --require-hashes \
            --requirement "$RUNNER_TEMP/requirements.txt"

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 17, the version of local development (backend README, Set up).
        image: postgres:17.11@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Passwords of a throwaway database that exists only in this job; never real secrets.
      DATABASE_URL_OWNER: postgresql+asyncpg://supportiq_owner:ci-owner@127.0.0.1:5432/supportiq
      DATABASE_URL_APP: postgresql+asyncpg://supportiq_app:ci-app@127.0.0.1:5432/supportiq
      # The service runs PostgreSQL on this runner without TLS (backend README, TLS).
      DATABASE_TLS: disable
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      SEED_PASSWORD_CUSTOMER: ci-customer
      SEED_PASSWORD_STAFF: ci-staff
      SEED_PASSWORD_MANAGER: ci-manager
      SEED_PASSWORD_ADMIN: ci-admin
      # A dummy service token and an address where nothing listens: the tests serve
      # ai-service from in-memory fakes and never call ai-service over the network (TEST-16).
      AI_SERVICE_BASE_URL: http://ai-service.invalid
      AI_SERVICE_TOKEN: ci-ai-service-token
      # The build version that getAdminVersions reports: the commit SHA, as a deploy sets it.
      BACKEND_BUILD_VERSION: ${{ github.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.11"
          enable-cache: false
      - name: Install the Python of .python-version and the locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Create the owner role and the database, as the superuser of the service
        run: |
          docker exec "${{ job.services.postgres.id }}" psql --username postgres \
            --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE supportiq_owner LOGIN CREATEDB CREATEROLE PASSWORD 'ci-owner'" \
            --command "CREATE DATABASE supportiq OWNER supportiq_owner"
      - name: Create the role supportiq_app, as the owner
        working-directory: backend
        run: uv run --locked backend create-app-role
      - name: Apply the migrations, as the owner (the tests migrate their own databases too)
        working-directory: backend
        run: uv run --locked backend migrate
      # The floors apply to the combined coverage below, so this step alone has none.
      - name: Run the unit tests with branch coverage
        working-directory: backend
        run: uv run --locked pytest tests/unit --cov --cov-report= --cov-fail-under=0
      - name: Run the integration and contract tests against PostgreSQL, adding to the coverage
        working-directory: backend
        run: uv run --locked pytest tests/integration tests/contract --cov --cov-append --cov-report=
      - name: Check the overall branch coverage of at least 80% (TEST-21)
        working-directory: backend
        run: uv run --locked coverage report --fail-under=80
      - name: Check the branch coverage of the domain and application layers of at least 90% (TEST-21)
        working-directory: backend
        run: >-
          uv run --locked coverage report --fail-under=90
          --include="*/supportiq_backend/*/domain/*,*/supportiq_backend/*/application/*"

  backend-image:
    name: backend-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the backend image (ARCH-10)
        run: docker build --tag supportiq-backend:ci backend
