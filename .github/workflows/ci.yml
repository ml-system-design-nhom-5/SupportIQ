name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supportiq_owner
          POSTGRES_PASSWORD: ci-disposable-pg-password
          POSTGRES_DB: supportiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U supportiq_owner -d supportiq"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      PSYCOPG_IMPL: binary
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/demo/requirements.txt
            pipeline/requirements.txt
            pipeline/requirements-transformers.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            -r apps/backend/requirements.txt \
            -r apps/demo/requirements.txt \
            -r pipeline/requirements.txt \
            -r pipeline/requirements-transformers.txt \
            pytest \
            pytest-asyncio

      - name: Provision disposable PostgreSQL role and synthetic CI secrets
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg

          owner_pass = "ci-disposable-pg-password"
          app_pass = "ci-disposable-app-password"

          with psycopg.connect(
              host="127.0.0.1",
              port=5432,
              dbname="supportiq",
              user="supportiq_owner",
              password=owner_pass,
              autocommit=True,
          ) as conn:
              conn.execute(
                  """
                  DO $$
                  BEGIN
                      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supportiq_app') THEN
                          CREATE ROLE supportiq_app WITH LOGIN PASSWORD 'ci-disposable-app-password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
                      END IF;
                  END
                  $$;
                  """
              )
              conn.execute("GRANT CONNECT ON DATABASE supportiq TO supportiq_app")

          secrets_path = Path(os.environ["RUNNER_TEMP"]) / "ci-application.json"
          secrets_path.write_text(
              json.dumps(
                  {
                      "database_url_owner": f"postgresql+psycopg://supportiq_owner:{owner_pass}@127.0.0.1:5432/supportiq",
                      "database_url_app": f"postgresql+psycopg://supportiq_app:{app_pass}@127.0.0.1:5432/supportiq",
                      "passwords": {
                          "customer": "CiCustomerPass123!",
                          "staff": "CiStaffPass123!",
                          "manager": "CiManagerPass123!",
                          "admin": "CiAdminPass123!",
                      },
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"SUPPORTIQ_APPLICATION_SECRETS={secrets_path}\n")
          PY

      - name: Run default pytest suite
        shell: bash
        run: |
          python -m pytest --junitxml="${RUNNER_TEMP}/pytest-junit.xml" --durations=25

      - name: Upload pytest JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-junit
          path: ${{ runner.temp }}/pytest-junit.xml
          if-no-files-found: warn

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/frontend install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm --dir apps/frontend test

      - name: Build frontend
        run: pnpm --dir apps/frontend build

      - name: Upload frontend build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/frontend/dist
          if-no-files-found: warn
