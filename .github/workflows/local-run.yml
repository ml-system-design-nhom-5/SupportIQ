# The smoke tests of the local run of the whole system (docs/design/local-run.md, Testing and
# evaluation). local-run-compose: the script tests, then a first start of the Compose way without
# AI, its health checks and a sign-in through each origin, a stop, and a second start without
# --yes and without a terminal, which must ask nothing and keep the data. local-run-compose-ai:
# the same with AI, from the pinned release, plus the readiness of ai-service and a check that no
# text was sent to the LLM. Each check runs once. Every workflow follows the convention in
# docs/guides/repository-checks.md.
name: local-run

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-run-compose:
    name: local-run-compose
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run the script tests of local-run.sh
        run: deploy/local/tests/test-local-run.sh
      - name: Start the local run with Compose, without AI
        run: deploy/local/local-run.sh start --without-ai --yes
      - name: Show the parts and their health
        run: deploy/local/local-run.sh status
      - name: Check backend, directly and through frontend, and sign in at each origin
        run: deploy/local/tests/smoke-check.sh running
      - name: Stop the local run
        run: deploy/local/local-run.sh stop
      - name: Check that no container remains and that the ports are free
        run: deploy/local/tests/smoke-check.sh stopped
      - name: Start again without --yes and without a terminal, which needs no question
        run: deploy/local/local-run.sh start --without-ai < /dev/null
      - name: Check that the data of the first start was kept
        run: deploy/local/tests/smoke-check.sh kept
      - name: Stop the local run again
        run: deploy/local/local-run.sh stop
      - name: Check again that no container remains and that the ports are free
        run: deploy/local/tests/smoke-check.sh stopped

  # Not a required check. It runs in every run, without a path filter, and the release cache keeps
  # the download of the archive to one per release: for release-2026-11-23-01, 324316560 bytes
  # (about 309 MiB), which the cache holds unpacked. The download sends the token of the run,
  # because the runners share the rate limit of anonymous requests by IP address (repository
  # checks, Workflow convention, rule 13; docs/design/local-run.md, Amendment of 2026-11-25). A
  # 403 or 429 of GitHub makes the download command end with status 5, so the start stops with
  # status 1 and names a network failure, and the job is run again by hand.
  local-run-compose-ai:
    name: local-run-compose-ai
    runs-on: ubuntu-24.04
    # Measured once, on 29b74e9 (run 45187195847): about 163 s in all, the first start 103 s, on
    # the first run of its cache key. 60 min stays above the deadlines of local-run.sh itself: two
    # waits of up to 600 s in each of two starts, so a slow run ends with the message of the script.
    timeout-minutes: 60
    env:
      # A fixed dummy value, no secret: no step sends a customer message, so ai-service never
      # calls the LLM, and smoke-check.sh ai proves it. It cannot match the key rule of gitleaks,
      # and no 4 characters of it appear in what local-run.sh prints, so the script tests that read
      # it from this file can check that no part of the key is shown.
      GEMINI_API_KEY: CI-DUMMY-ZQXJ
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Read the release ID of the pinned file, the key of the release cache
        id: pinned
        run: |
          release_id=$(sed -n 's/^release_id=//p' eval/releases/pinned-release.txt)
          test -n "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Restore the release cache of the pinned release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/supportiq/releases
          key: local-run-release-${{ steps.pinned.outputs.release_id }}
      - name: Start the local run with Compose, with AI from the pinned release
        env:
          # Read-only (contents: read). The download command sends it only to api.github.com.
          SUPPORTIQ_RELEASE_TOKEN: ${{ github.token }}
        run: deploy/local/local-run.sh start --yes
      - name: Show the parts and their health
        run: deploy/local/local-run.sh status
      - name: Check backend, directly and through frontend, and sign in at each origin
        run: deploy/local/tests/smoke-check.sh running
      - name: Check that ai-service is ready and that no text was sent to the LLM
        run: deploy/local/tests/smoke-check.sh ai
      - name: Stop the local run
        run: deploy/local/local-run.sh stop
      - name: Check that no container remains and that the ports are free
        run: deploy/local/tests/smoke-check.sh stopped
      - name: Start again without --yes and without a terminal, so a download would stop it
        run: deploy/local/local-run.sh start < /dev/null
      - name: Check that the data of the first start was kept
        run: deploy/local/tests/smoke-check.sh kept
      - name: Check again that ai-service is ready and that no text was sent to the LLM
        run: deploy/local/tests/smoke-check.sh ai
      - name: Stop the local run again
        run: deploy/local/local-run.sh stop
      - name: Check again that no container remains and that the ports are free
        run: deploy/local/tests/smoke-check.sh stopped
