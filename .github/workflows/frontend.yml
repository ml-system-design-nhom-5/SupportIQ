# frontend checks: format, lint, types, boundaries, the generated client, unit and component
# tests with coverage, the Storybook build and its axe checks, the production build, the UI flow
# tests against the Prism mock, and the dependency audit. The tool versions come from
# frontend/pnpm-lock.yaml and contracts/pnpm-lock.yaml. Every workflow follows the convention in
# docs/guides/repository-checks.md.
name: frontend

on:
  push:
    branches:
      - main
      - "build/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: frontend-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pnpm version of frontend/package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          package_json_file: frontend/package.json
      - name: Set up the Node.js version of .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            contracts/pnpm-lock.yaml
      - name: Install the frontend tools from the lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install the contract tools, which serve the Prism mock
        working-directory: contracts
        run: pnpm install --frozen-lockfile
      - name: Audit the frontend dependencies for high and critical vulnerabilities (WF-31)
        working-directory: frontend
        run: pnpm audit --audit-level=high
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.11"
          enable-cache: false
      - name: Install pre-commit
        run: |
          uv tool install --python 3.12 pre-commit==4.7.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Check the format, lint, types, boundaries, and generated client of frontend
        run: pre-commit run frontend-check --all-files --show-diff-on-failure
      - name: Install the Chromium of Playwright
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the unit and component tests with coverage (TEST-21)
        working-directory: frontend
        run: pnpm run test:unit
      - name: Build Storybook
        working-directory: frontend
        run: pnpm run build-storybook
      - name: Run every story with its axe checks (UI-32)
        working-directory: frontend
        run: pnpm run test:stories
      - name: Build frontend for production
        working-directory: frontend
        run: pnpm run build
      - name: Run the UI flow tests against the Prism mock
        working-directory: frontend
        run: pnpm run test:e2e
