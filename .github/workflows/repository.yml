# Repository checks: file hygiene, secrets in the git history, Markdown style and links, and
# workflow files. Every hook comes from .pre-commit-config.yaml. Every workflow follows the
# convention in docs/guides/repository-checks.md.
name: repository

on:
  push:
    branches:
      - chore/fe-be-supportiq-ecom
      - "build/**"
  pull_request:
    branches:
      - chore/fe-be-supportiq-ecom

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the full history, which gitleaks scans
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.11"
          enable-cache: false
      - name: Install pre-commit
        run: |
          uv tool install --python 3.12 pre-commit==4.7.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Cache the hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run the repository hooks
        run: pre-commit run --all-files --hook-stage manual --show-diff-on-failure
