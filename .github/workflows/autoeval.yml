name: Offline Autoeval

on:
  pull_request:
  push:
    branches:
      - main
      - minh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-autoeval:
    name: Offline LLM Autoeval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PSYCOPG_IMPL: binary
      AUTOEVAL_OUT: artifacts/evaluation/autoeval-ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/demo/requirements.txt
            pipeline/requirements.txt
            pipeline/requirements-transformers.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            -r apps/backend/requirements.txt \
            -r apps/demo/requirements.txt \
            -r pipeline/requirements.txt \
            -r pipeline/requirements-transformers.txt \
            pytest \
            pytest-asyncio

      - name: Run autoeval unit tests
        run: python -m pytest tests/unit/test_autoeval.py -q

      - name: Run offline LLM evaluation gates
        shell: bash
        run: |
          rm -rf "$AUTOEVAL_OUT"
          set +e
          python -m pipeline.evaluation.autoeval run \
            --suite llm \
            --llm-mode offline \
            --compare pipeline/configs/autoeval_baseline.json \
            --tag "ci-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            --out "$AUTOEVAL_OUT"
          code=$?
          set -e

          if [ -f "$AUTOEVAL_OUT/latest.txt" ]; then
            run_dir="$(cat "$AUTOEVAL_OUT/latest.txt")"
            if [ -f "$run_dir/report.md" ]; then
              cat "$run_dir/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Offline autoeval exited $code before producing a fresh report; stale tracked latest.txt was ignored." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "_Scope: offline LLM evaluation suite only (--suite llm --llm-mode offline). Real ML classifier evaluation is pending verified model provisioning and is not claimed by this check._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload fresh autoeval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autoeval-offline-report
          path: artifacts/evaluation/autoeval-ci
          if-no-files-found: warn
