[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: mark test as requiring loopback HTTP, subprocess server, or SQLite integration
    real_model: mark test as loading actual model weights on disk
    cuda: mark test as requiring GPU CUDA acceleration
    live: mark test as requiring external network and credentials (opt-in via --run-live)
testpaths = tests
addopts = --strict-markers -m "not real_model and not cuda and not live"
