[project]
name = "supportiq-ai-service"
version = "0.1.0"
description = "SupportIQ ai-service: intent classification, KB retrieval, the routing recommendation, and LLM drafting for backend."
readme = "README.md"
# One Python version for all Python code, pinned with ../.python-version (PY-01).
requires-python = "~=3.14.4"
# Runtime dependencies. Every one is justified in the Dependencies table of README.md (WF-27).
# numpy, torch, and transformers keep the versions that the real model of main was evaluated
# with on 2026-11-04 (ADR-0021, Where the code of main goes).
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "opentelemetry-api==1.45.2",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "starlette==1.10.0",
    "transformers==5.22.1",
    "uvicorn==0.54.0",
]

[project.scripts]
ai-service = "supportiq_ai_service.composition_root:main"

[dependency-groups]
# Development dependencies, separate from the runtime ones (PY-46).
dev = [
    "anyio==4.16.0",
    "coverage==7.17.2",
    "datamodel-code-generator==0.90.0",
    "hypothesis==6.170.15",
    "import-linter==2.16",
    "pip-audit==2.10.1",
    "pyright[nodejs]==1.1.414",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-randomly==5.0.0",
    "pytest-socket==0.8.1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.4",
    "schemathesis==4.33.1",
]
# torch comes from the PyTorch CPU index, in a group of its own and only on Linux, so the rest
# installs on macOS without it (ADR-0021, Python and dependencies, statement 2). The image and
# CI install it with `uv sync --locked --group torch`.
torch = ["torch==2.15.0 ; sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

# ----- Code generation (CON-25, CON-26) -----
# `uv run datamodel-codegen` reads these options. The output is never edited by hand, and CI
# regenerates it and fails when the committed file differs. The options are those of backend.
[tool.datamodel-codegen]
input = "../contracts/ai-service.openapi.yaml"
input-file-type = "openapi"
output = "src/supportiq_ai_service/generated/__init__.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.14"
use-annotated = true
field-constraints = true
use-standard-collections = true
use-union-operator = true
use-specialized-enum = true
strict-nullable = true
disable-timestamp = true
use-double-quotes = true
formatters = ["builtin"]
# An optional field of a request that the body leaves out is `MISSING`, not None, so a body
# with `null` in it is refused (the contract never uses null, CON-08).
use-missing-sentinel = true
target-pydantic-version = "2.14"
# Pydantic cannot apply the `pattern` of `Timestamp` to a datetime type, so every timestamp is
# a string, as in backend.
type-overrides = { Timestamp = "builtins.str" }

# ----- Formatting and linting (PY-03, PY-04, PY-05) -----
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Generated code is never linted (CON-26).
extend-exclude = ["src/supportiq_ai_service/generated"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "ANN", "B", "PIE", "RUF", "S", "ASYNC", "DTZ", "T20",
    "ERA", "C90", "PL", "PT", "PTH", "RET", "SIM", "C4", "TRY", "EM", "ARG", "TID",
]

[tool.ruff.lint.per-file-ignores]
# Tests: `assert` is the pytest assertion (PY-29); test names state the behavior, so a
# docstring per test function would repeat the name (TEST-03); the credentials are synthetic
# test values, never secrets (TEST-18).
"tests/**" = ["S101", "D103", "S105", "S106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 8
max-returns = 4
max-statements = 30
max-nested-blocks = 3

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["supportiq_ai_service", "tests"]

# ----- Type checking (PY-03, CODE-26) -----
[tool.pyright]
include = ["src", "tests"]
exclude = ["src/supportiq_ai_service/generated", "**/__pycache__", ".venv"]
ignore = ["src/supportiq_ai_service/generated"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "error"
reportUnnecessaryTypeIgnoreComment = "error"

# ----- Tests (TEST-14 to TEST-16, TEST-21) -----
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# The fakes and builders live in the `tests` package, next to the tests that own them (ARCH-27).
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # Parallel workers (TEST-15).
    "--numprocesses=auto",
    "--dist=loadfile",
    # No socket in unit tests (TEST-16). Integration and contract tests may use loopback only.
    "--disable-socket",
    "--allow-unix-socket",
    # Tests that load the real weights run only when selected with -m real_model (README.md, Tests).
    "-m", "not real_model",
]
markers = [
    "real_model: loads the real model weights of a release; skipped unless selected with -m real_model",
]
xfail_strict = true
# Zero warnings (PY-03): every warning fails the test run.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["supportiq_ai_service"]
# Generated code is excluded from coverage (CON-26, TEST-22).
omit = ["*/supportiq_ai_service/generated/*"]

[tool.coverage.report]
# The overall floor of TEST-21. The floor for the domain and application layers is checked by
# a second `coverage report` with --include (README.md, Commands).
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "assert_never\\(",
    "raise AssertionError",
    "\\.\\.\\.$",
]

# ----- Layer and feature boundaries (ARCH-11, ARCH-17, ARCH-18, ARCH-19) -----
# Contracts for the domain and application layers come with those layers, once the pipeline
# design names the features (README.md, Open questions).
[tool.importlinter]
root_package = "supportiq_ai_service"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Features depend on each other without cycles, and platform on no feature (ARCH-18)"
type = "layers"
layers = [
    "supportiq_ai_service.composition_root",
    "supportiq_ai_service.intent | supportiq_ai_service.retrieval | supportiq_ai_service.drafting",
    "supportiq_ai_service.release",
    "supportiq_ai_service.platform",
]

[[tool.importlinter.contracts]]
name = "ai-service imports no other component and no code of main (core rule 3, ADR-0021)"
type = "forbidden"
source_modules = ["supportiq_ai_service"]
forbidden_modules = ["apps", "pipeline", "supportiq_backend", "supportiq_eval", "supportiq_ml"]

[[tool.importlinter.contracts]]
name = "Adapters use no contract model (ARCH-11, ARCH-15)"
type = "forbidden"
source_modules = [
    "supportiq_ai_service.intent.adapters",
    "supportiq_ai_service.retrieval.adapters",
    "supportiq_ai_service.drafting.adapters",
]
forbidden_modules = ["supportiq_ai_service.generated"]
