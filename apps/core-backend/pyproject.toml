[project]
name = "supportiq-core-backend"
version = "0.1.0"
description = "SupportIQ Core Backend Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1.1",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "argon2-cffi>=23.1.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
