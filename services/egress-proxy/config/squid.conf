# Minimal secure Squid egress proxy configuration
# Restricts outbound HTTP/HTTPS to approved LLM and upstream endpoints

acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT

# Approved domains for outbound LLM traffic
acl allowed_llm_domains dstdomain .openai.com api.anthropic.com

# Enforce destination restrictions
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_llm_domains
http_access deny all

# Proxy listening port
http_port 3128

# Security & Privacy: No caching, no request/response body logging
cache deny all
access_log none
via off
forwarded_for delete
