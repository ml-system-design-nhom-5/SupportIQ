services:
  edge-gateway:
    image: nginx:1.25-alpine
    container_name: supportiq-edge-gateway
    ports:
      - "80:80"
    volumes:
      - ../edge/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core-api-1
      - core-api-2
    networks:
      - edge_net
    deploy:
      resources:
        limits:
          memory: 128M

  core-api-1:
    build:
      context: ../../apps/core-backend
      dockerfile: Dockerfile
    container_name: supportiq-core-api-1
    environment:
      APP_DB_URL: postgresql+asyncpg://app_user:app_password@postgres:5432/supportiq
      AUDIT_WRITER_DB_URL: postgresql+asyncpg://audit_writer:audit_password@postgres:5432/supportiq
      AUDIT_READER_DB_URL: postgresql+asyncpg://audit_reader:audit_password@postgres:5432/supportiq
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_TOKEN: dev-internal-service-token-secret
      JWT_SECRET_KEY: dev-jwt-secret-key-at-least-32-chars-long
      APP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PII_RESOLVER_URL: http://pii-resolver:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge_net
      - core_net
      - vault_net
    deploy:
      resources:
        limits:
          memory: 512M

  core-api-2:
    build:
      context: ../../apps/core-backend
      dockerfile: Dockerfile
    container_name: supportiq-core-api-2
    environment:
      APP_DB_URL: postgresql+asyncpg://app_user:app_password@postgres:5432/supportiq
      AUDIT_WRITER_DB_URL: postgresql+asyncpg://audit_writer:audit_password@postgres:5432/supportiq
      AUDIT_READER_DB_URL: postgresql+asyncpg://audit_reader:audit_password@postgres:5432/supportiq
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_TOKEN: dev-internal-service-token-secret
      JWT_SECRET_KEY: dev-jwt-secret-key-at-least-32-chars-long
      APP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PII_RESOLVER_URL: http://pii-resolver:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge_net
      - core_net
      - vault_net
    deploy:
      resources:
        limits:
          memory: 512M

  ai-worker:
    build:
      context: ../../apps/core-backend
      dockerfile: Dockerfile
    container_name: supportiq-ai-worker
    command: ["python", "-m", "src.modules.orchestration.worker"]
    environment:
      APP_DB_URL: postgresql+asyncpg://app_user:app_password@postgres:5432/supportiq
      AUDIT_WRITER_DB_URL: postgresql+asyncpg://audit_writer:audit_password@postgres:5432/supportiq
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_TOKEN: dev-internal-service-token-secret
      ML_INFERENCE_URL: http://ml-inference:8001
      EGRESS_PROXY_URL: http://egress-proxy:3128
      PII_RESOLVER_URL: http://pii-resolver:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    networks:
      - core_net
      - ml_net
      - egress_net
      - vault_net
    deploy:
      resources:
        limits:
          memory: 768M

  pii-resolver:
    build:
      context: ../../apps/core-backend
      dockerfile: Dockerfile
    container_name: supportiq-pii-resolver
    command: ["python", "-m", "src.modules.privacy.resolver_app"]
    environment:
      VAULT_DB_URL: postgresql+asyncpg://vault_user:vault_password@postgres:5432/supportiq
      INTERNAL_SERVICE_TOKEN: dev-internal-service-token-secret
      APP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vault_net
    deploy:
      resources:
        limits:
          memory: 256M

  ml-inference:
    build:
      context: ../../services/ml-inference
      dockerfile: Dockerfile
    container_name: supportiq-ml-inference
    networks:
      - ml_net
    deploy:
      resources:
        limits:
          memory: 512M

  egress-proxy:
    image: ubuntu/squid:5.2-22.04_beta
    container_name: supportiq-egress-proxy
    volumes:
      - ../../services/egress-proxy/config/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - egress_net
      - public_egress_net
    deploy:
      resources:
        limits:
          memory: 128M

  postgres:
    image: postgres:16-alpine
    container_name: supportiq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: supportiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supportiq"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - core_net
      - vault_net
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: supportiq-redis
    volumes:
      - ../cache/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - core_net
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  edge_net:
    driver: bridge
  core_net:
    driver: bridge
    internal: true
  vault_net:
    driver: bridge
    internal: true
  ml_net:
    driver: bridge
    internal: true
  egress_net:
    driver: bridge
    internal: true
  public_egress_net:
    driver: bridge

volumes:
  postgres_data:
