# Redocly CLI configuration for the contract checks. Commands: contracts/README.md.
telemetry: off
apis:
  backend:
    root: backend.openapi.yaml
    output: dist/backend.openapi.yaml
extends:
  - recommended-strict
plugins:
  - ./lint/supportiq-rules.ts
rules:
  # The repository has no license file. Choosing one is a team decision.
  info-license: off
  # Validates every example file against its schema; unknown fields fail too (CON-06, CON-21).
  no-invalid-media-type-examples:
    severity: error
    allowAdditionalProperties: false
  no-unused-components: error
  operation-operationId: error
  operation-operationId-unique: error
  paths-kebab-case: error
  security-defined: error
  # Replaced by supportiq/operation-4xx-response, which exempts only operations without input
  # and without a session, such as the health checks (ERR-18). No problem is ignored.
  operation-4xx-response: off
  supportiq/operation-id-camel-case: error
  supportiq/operation-documented: error
  supportiq/operation-security: error
  supportiq/operation-4xx-response: error
  supportiq/schema-description: error
  supportiq/request-body-closed: error
  supportiq/property-naming: error
  supportiq/problem-type-urn: error
  supportiq/limit-maximum: error
  supportiq/response-examples: error
