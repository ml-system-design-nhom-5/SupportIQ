# pnpm settings for the contract tooling (see README.md, Tools).

# @scarf/scarf is an install-time analytics package pulled in by Prism.
# Its build script sends a network request, so it never runs (SEC-01).
allowBuilds:
  '@scarf/scarf': false

# Prism 5.16.0 pulls lodash 4.17.21 through postman-collection (GHSA-r5fr-rjxr-66jc, high;
# GHSA-xxjr-mmjv-4gpg). 4.18.1 is the same major version and is already in the tree.
overrides:
  postman-collection>lodash: 4.18.1

# WF-31: Prism 5.16.0 pulls @faker-js/faker 5.5.3 through postman-collection
# (GHSA-qxc2-j82w-r537, high). The fix, 10.5.0, breaks postman-collection at load time.
# Prism only mocks this repository's own contract, on a developer machine or in CI, so no
# untrusted template reaches faker. Accepted only with its tech-debt issue
# ("Remove the faker audit exception once Prism no longer pulls @faker-js/faker below 10.5.0").
auditConfig:
  ignoreGhsas:
    - GHSA-qxc2-j82w-r537
