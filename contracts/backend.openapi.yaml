      summary: Read the report for a period
      description: >-
        Returns the figures of FR-10 for the period from `start_at`, included, to `end_at`,
        excluded. Role: `manager` (ADR-0012). `backend` computes them on request from its own
        records: tickets, suggestions, staff decisions, and escalations; never from telemetry
        (LOG-33). The report holds aggregates only, no text and no identifier of a ticket. The
        console shows each figure with a label in business language, its unit, and its target
        where the requirements give one, and computes no figure itself (UI-14, UI-44).
