        - admin
      summary: Create a staff or manager account
      description: >-
        Creates an active `staff` or `manager` account with the password that the admin sets
        (ADR-0015). Role: `admin`. The login name is `<role>-<number>`. With `login_number`,
        `backend` uses that number and returns `409 login-name-taken` when an account already
        has the login name. Without it, `backend` takes one more than the largest number of any
        login name with the prefix `<role>-`, whatever the current role or status of that
        account, or 1 when there is none. A role change never renames an account. In the same
        transaction, `backend` stores only the Argon2id hash of `password` and writes the audit
        log entry `account.created`. Changes to accounts are serialized, and the caller is
        reloaded after the wait, so a caller who is no longer an active admin gets `401`. A
        `role` other than `staff` or `manager` returns `422`. The `Idempotency-Key` is compared
        without `password` (ERR-15): a retry with the same key and the same other fields returns
