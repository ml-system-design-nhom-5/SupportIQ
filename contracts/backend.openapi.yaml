openapi: 3.1.0
info:
  title: SupportIQ backend API
  version: 1.2.0
  description: |
    The contract between `frontend` and `backend` for sign-in, the read-only shop, the review
    console of staff and managers, and the admin area. Version 1.0.1 holds the operations of
    contract PR 2, taken from the [contracts v1 design](../docs/design/contracts-v1.md)
    (revision 2) and the [backend foundation design](../docs/design/backend-foundation.md).
    Version 1.1.0 adds the own password change, account creation, and password resets of the
    [account management design](../docs/design/account-management.md) (ADR-0015). Version
    1.2.0 adds the console operations and `getAdminVersions` of the contracts v1 design, as
    the [backend ticket workflow design](../docs/design/backend-ticket-workflow.md) implements
    them.

    ## Responsibility

    - `backend` is the only enforcement point for authentication, roles, and object-level
      access (SEC-16, SEC-17, SEC-20). `frontend` hides an action only as a convenience.
    - The AI only suggests. `sendReply` is the only operation that sends anything to a
      customer, and it always needs a staff or manager action (FR-04). Once a ticket requires
      authority, only a manager sends its reply (FR-06). No reply or proposal body may contain
      a placeholder (SEC-38).
    - No operation creates, changes, or deletes a product, an order, a shipment, or a refund
      (ADR-0013). The only writes are sessions, shop tickets, internal accounts, changes to
      internal accounts, passwords, ticket views, suggestions, reply proposals, replies, and
      escalations.
    - `backend` stores only the Argon2id hash of a password. It never generates a password, and
      no response has a field that can carry one (ADR-0015).
    - No `/v1/shop/` schema has a field that can carry AI output. No `/v1/admin/` schema has a
      field that can carry a ticket, a message, an order, or a report, and no admin operation
      reaches a customer account (SEC-41).
    - `backend` never sends a field that this contract does not define (CON-21).

    ## Authentication and roles

    Sign-in follows ADR-0009. `createSession` sets the `supportiq_session` cookie, and every
    other operation except the health checks requires it (security scheme `sessionCookie`).
    The cookie is `HttpOnly`: `frontend` never reads it and learns the account from
    `getCurrentSession`. Each operation lists the roles that may call it in its description and
    in `x-supportiq-roles`, which repeats the permission table of the contracts v1 design. A
    signed-in role that is not listed gets `403 forbidden`.

    The state-changing operations (`createSession`, `deleteCurrentSession`, `changeOwnPassword`,
    `createShopTicket`, `recordTicketView`, `createSuggestion`, `createReplyProposal`,
    `sendReply`, `createEscalation`, `createAdminAccount`, `changeAccountRole`,
    `changeAccountStatus`, and `resetAccountPassword`) check the `Origin` header against the
    allowed origins before anything else, authentication included. The browser sets that
    header, so it is not a parameter. A missing or unknown origin returns `403 forbidden`
    (ADR-0009, statement 7).

    ## Errors

    Every error body is a `ProblemDetails` with a problem type from the registry (CON-12) and
    the media type `application/problem+json`. `backend` returns `422 invalid-request` for every
    invalid request, including a body that is not valid JSON, and never returns `400`.

    The ingress can answer `413` or `429` before `backend` sees a request, and `502` or `504`
    when `backend` is unreachable or a write in flight fails (ADR-0011). Those responses are not
    part of this contract and their bodies are not `ProblemDetails`. `frontend` treats all four
    as technical failures. After `502` or `504` the outcome of a write is unknown, and a retry
    with the same `Idempotency-Key` cannot repeat its effect (ERR-15).

    ## Headers

    - `traceparent` is optional on every request. `backend` starts a new trace when it is absent
      or invalid, and returns the trace ID in every error body.
    - `Idempotency-Key` is required on `changeOwnPassword`, `createShopTicket`,
      `recordTicketView`, `createSuggestion`, `createReplyProposal`, `sendReply`,
      `createEscalation`, `createAdminAccount`, `changeAccountRole`, `changeAccountStatus`, and
      `resetAccountPassword`, the writes that a client may retry (ERR-15, CON-13).
      `createSession` and `deleteCurrentSession` take none and are never retried automatically
      (TS-29): before sign-in there is no account to scope a key to, a repeated sign-in only
      creates one more session, and a repeated sign-out gets `401`, which `frontend` treats as
      signed out.
    - No operation uses a custom `X-` header (CON-13).

    ## Timeouts

    - **Latency target:** the requirements set none for these operations. NFR-08 covers a
      suggestion, from ticket creation until its draft part leaves `pending` (p95 at most
      12 s). `createSuggestion` answers before the suggestion runs, and the console polls
      `getConsoleTicket`.
    - **Caller's timeout:** `frontend` stops waiting for a response after 10 000 ms per
      request, a `frontend` setting. That is the sum of the single bounds of `backend` below: a
      pool wait of 3 000 ms, one statement of 5 000 ms, and the sign-in delay of 2 000 ms. A
      request with several statements can take longer: `backend` may then finish a write after
      `frontend` stopped waiting, and a retry with the same `Idempotency-Key` returns its result.
    - **Provider bounds:** `backend` bounds every database call with the timeout settings of the
      backend foundation design (`database_connect_timeout_ms`, `database_statement_timeout_ms`,
      `database_lock_timeout_ms`, `database_pool_timeout_ms`) and answers `503 not-ready` when
      one fires. A throttled `createSession` or `changeOwnPassword` also waits
      `sign_in_failure_delay_ms`. `recordTicketView`, `getConsoleKbDocumentVersion`, and
      `getAdminVersions` wait for `ai-service` at most `ai_service_read_timeout_ms`, 3 000 ms
      at first; no other operation waits for `ai-service`.
    - **Retries:** reads, and writes with an `Idempotency-Key`, may be retried after `503` as
      ERR-12 and TS-29 allow.

    ## Compatibility

    Version 1.0.0 is the first version and has no earlier consumer. Compatible and breaking
    changes follow CON-19 and CON-20. Consumers ignore unknown response fields (CON-21) and
    map unknown enum values to a safe default (CON-22). Every change of version 1.1.0 is
    compatible: new operations, a new response field, a narrower response length, and new enum
    values in responses. Every change of version 1.2.0 is compatible too: new operations, new
    schemas, and four new problem types in responses.
servers:
  - url: /
    description: >-
      The base URL of `backend`. Every path of this contract is relative to it.
tags:
  - name: sessions
    description: >-
      Sign-in, the current session, the own password change, and sign-out (ADR-0009,
      ADR-0015).
  - name: shop
    description: >-
      The read-only catalog, the customer's own orders, and the customer's own tickets
      (ADR-0013). Callable by `customer` only.
  - name: console
    description: >-
      The review console: ticket queues, the ticket workspace, suggestions, reply proposals,
      replies, escalations, KB document versions, and reports (FR-04 to FR-07, FR-10). Callable
      by `staff` and `manager`, as each operation states.
  - name: admin
    description: >-
      Internal accounts: listing, creation, role changes, status changes, and password resets,
      and the versions in use (ADR-0012, ADR-0015). Callable by `admin` only.
  - name: health
    description: Liveness and readiness of `backend` (ERR-18). No session is required.
paths:
  /v1/sessions:
    post:
      operationId: createSession
      tags:
        - sessions
      summary: Sign in with a login name and a password
      description: >-
        Verifies the credentials and creates a session (ADR-0009). Callable without a session.
        On success, `backend` stores only the SHA-256 hash of a new random session identifier
        and returns the identifier in the `supportiq_session` cookie. An unknown login name, a
        wrong password, and a deactivated account return the same `401`, and the password is
        verified even for an unknown name, so the response does not reveal which login names
        exist. While a login name has `sign_in_failure_limit` or more failures within
        `sign_in_failure_window_ms`, every attempt for it waits `sign_in_failure_delay_ms` and
        then gets `401` without a password check, even with the right password (backend
        foundation design, Sign-in and sessions).
      security: []
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: >-
            The session was created. The body describes the signed-in account, and
            `Set-Cookie` carries the session identifier.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
              examples:
                created:
                  $ref: ./examples/createSession/created.json
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/sessions/current:
    get:
      operationId: getCurrentSession
      tags:
        - sessions
      summary: Read the signed-in account
      description: >-
        Returns the account of the current session. Roles: `customer`, `staff`, `manager`, and
        `admin`. `frontend` uses it after sign-in and on load to choose the area of the role:
        `/shop` for `customer`, `/console` for `staff` and `manager`, and `/admin` for `admin`.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - customer
        - staff
        - manager
        - admin
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The account of the current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
              examples:
                customer:
                  $ref: ./examples/getCurrentSession/customer.json
                staff:
                  $ref: ./examples/getCurrentSession/staff.json
                manager:
                  $ref: ./examples/getCurrentSession/manager.json
                admin:
                  $ref: ./examples/getCurrentSession/admin.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
    delete:
      operationId: deleteCurrentSession
      tags:
        - sessions
      summary: Sign out
      description: >-
        Deletes the current session. Roles: `customer`, `staff`, `manager`, and `admin`. It takes
        no `Idempotency-Key`: a retry after a success gets `401`, which `frontend` treats as
        signed out.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - customer
        - staff
        - manager
        - admin
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '204':
          description: >-
            The session was deleted. There is no body, and no `Set-Cookie`: the browser keeps
            the cookie, which no longer names a session, so it gets `401`.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/sessions/current/password-changes:
    post:
      operationId: changeOwnPassword
      tags:
        - sessions
      summary: Change the password of the signed-in account
      description: >-
        Replaces the password of the caller's own account (ADR-0015). Roles: `customer`,
        `staff`, `manager`, and `admin`. A wrong `current_password` counts as a sign-in failure
        of the account's login name. While that name has `sign_in_failure_limit` or more failures
        within `sign_in_failure_window_ms`, every attempt waits `sign_in_failure_delay_ms` and is
        refused without a password check, even with the right password (ADR-0009, statement 8).
        Both return `422` with `current_password_incorrect`, never `401`, so the session stays.
        On success, in one transaction, `backend` stores only the Argon2id hash of
        `new_password`, deletes every other session of the account when
        `is_signed_out_elsewhere` is true, deletes the sign-in failures of the login name, and
        writes the audit log entry `account.password_changed`. The current session always stays.
        The `Idempotency-Key` is compared without the password fields (ERR-15): a retry with the
        same key and the same `is_signed_out_elsewhere` returns the original `201`, whatever the
        passwords.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - customer
        - staff
        - manager
        - admin
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOwnPasswordRequest'
      responses:
        '201':
          description: >-
            The password was changed, or this is the original result of a retry. The body
            describes the caller's account, as `getCurrentSession` does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
              examples:
                changed:
                  $ref: ./examples/changeOwnPassword/changed.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/InvalidPasswordChange'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/shop/products:
    get:
      operationId: listShopProducts
      tags:
        - shop
      summary: List the catalog products
      description: >-
        Returns one page of the read-only catalog (ADR-0013). Role: `customer`. Products are
        ordered by `name`, ascending, and products with the same name by `product_id`,
        ascending. Both are compared by Unicode code point, not by locale.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - customer
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopProductPage'
              examples:
                first-page:
                  $ref: ./examples/listShopProducts/first-page.json
                last-page:
                  $ref: ./examples/listShopProducts/last-page.json
                empty:
                  $ref: ./examples/listShopProducts/empty.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '422':
          $ref: '#/components/responses/InvalidListRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/shop/products/{product_id}:
    get:
      operationId: getShopProduct
      tags:
        - shop
      summary: Read one catalog product
      description: >-
        Returns one product of the catalog. Role: `customer`. An unknown `product_id` returns
        `404`.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - customer
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopProductView'
              examples:
                found:
                  $ref: ./examples/getShopProduct/found.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/shop/orders:
    get:
      operationId: listShopOrders
      tags:
        - shop
      summary: List the caller's orders
      description: >-
        Returns one page of the signed-in customer's own orders, and never another customer's
        (SEC-17). Role: `customer`. Orders are ordered by `placed_at`, newest first, and orders
        with the same `placed_at` by `order_id`, ascending by Unicode code point.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - customer
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the caller's orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopOrderPage'
              examples:
                first-page:
                  $ref: ./examples/listShopOrders/first-page.json
                last-page:
                  $ref: ./examples/listShopOrders/last-page.json
                empty:
                  $ref: ./examples/listShopOrders/empty.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '422':
          $ref: '#/components/responses/InvalidListRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/shop/orders/{order_id}:
    get:
      operationId: getShopOrder
      tags:
        - shop
      summary: Read one of the caller's orders
      description: >-
        Returns one of the signed-in customer's orders with its lines, shipment, and refund.
        Role: `customer`. An unknown `order_id`, or the ID of another customer's order, returns
        the same `404`, so the order's existence is not revealed (SEC-17).
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - customer
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopOrderView'
              examples:
                in-transit:
                  $ref: ./examples/getShopOrder/in-transit.json
                refund-under-review:
                  $ref: ./examples/getShopOrder/refund-under-review.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/shop/tickets:
    get:
      operationId: listShopTickets
      tags:
        - shop
      summary: List the caller's tickets
      description: >-
        Returns one page of the signed-in customer's own tickets, optionally only those about
        one order. Role: `customer`. Tickets are ordered by `created_at`, newest first, and
        tickets with the same `created_at` by `ticket_id`, ascending by Unicode code point. The
        shop lists only tickets created through `createShopTicket`; tickets imported for
        evaluation never appear here. An `order_id` that is not one of the caller's orders
        returns `404`.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - customer
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: order_id
          in: query
          required: false
          description: >-
            Lists only the tickets about this order, which must be one of the caller's orders.
            Absent means every ticket of the caller. Data class: Confidential.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: One page of the caller's tickets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopTicketPage'
              examples:
                first-page:
                  $ref: ./examples/listShopTickets/first-page.json
                last-page:
                  $ref: ./examples/listShopTickets/last-page.json
                empty:
                  $ref: ./examples/listShopTickets/empty.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidListRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
    post:
      operationId: createShopTicket
      tags:
        - shop
      summary: Write to support about one of the caller's orders
      description: >-
        Creates a ticket that holds the customer's message about one of their orders (ADR-0013).
        Role: `customer`. The ticket starts `open` for staff, and the customer sees it as
        `received`. The customer never waits for AI: `backend` answers before any suggestion
        runs. An `order_id` that is not one of the caller's orders returns `404` and creates
        nothing. A retry with the same `Idempotency-Key` and the same body returns the original
        `201` and creates no second ticket.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - customer
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShopTicketRequest'
      responses:
        '201':
          description: The ticket was created, or this is the original result of a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopTicketView'
              examples:
                created:
                  $ref: ./examples/createShopTicket/created.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRoleOrOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/shop/tickets/{ticket_id}:
    get:
      operationId: getShopTicket
      tags:
        - shop
      summary: Read one of the caller's tickets
      description: >-
        Returns one of the signed-in customer's tickets, with the reply once staff sent it.
        Role: `customer`. An unknown `ticket_id`, the ID of another customer's ticket, or the ID
        of an imported ticket returns the same `404` (SEC-17).
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - customer
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopTicketView'
              examples:
                received:
                  $ref: ./examples/getShopTicket/received.json
                replied:
                  $ref: ./examples/getShopTicket/replied.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/console/tickets:
    get:
      operationId: listConsoleTickets
      tags:
        - console
      summary: List the tickets in one status
      description: >-
        Returns one page of the tickets in one `status`, for the console queues. Roles: `staff`,
        who may list `open` tickets only and get `403` for another status, and `manager`, who
        may list every status. `open`, `awaiting_approval`, and `escalated` tickets are ordered
        by `created_at`, oldest first, so the ticket that waited longest comes first; `closed`
        tickets are ordered by `closed_at`, newest first. Tickets with the same time are ordered
        by `ticket_id`, ascending by Unicode code point. All staff share one queue: no ticket is
        assigned to a person (contracts v1 design, non-goals).
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - staff
        - manager
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ConsoleTicketStatusFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the tickets in the status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSummaryPage'
              examples:
                open-queue:
                  $ref: ./examples/listConsoleTickets/open-queue.json
                awaiting-approval:
                  $ref: ./examples/listConsoleTickets/awaiting-approval.json
                escalated:
                  $ref: ./examples/listConsoleTickets/escalated.json
                closed:
                  $ref: ./examples/listConsoleTickets/closed.json
                empty:
                  $ref: ./examples/listConsoleTickets/empty.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '422':
          $ref: '#/components/responses/InvalidConsoleListRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/console/tickets/{ticket_id}:
    get:
      operationId: getConsoleTicket
      tags:
        - console
      summary: Read the workspace of a ticket
      description: >-
        Returns the ticket workspace: the ticket, the customer's message, the order and the
        customer's other orders, the current suggestion with pseudonyms restored, the proposal,
        the escalation, the reply, and the actions that the caller may take now. Roles: `staff`
        and `manager`, on a ticket in any state; staff get an empty `allowed_actions` on a ticket
        that is not `open`. This read changes nothing; the console polls it while a suggestion
        part is `pending`, and calls `recordTicketView` once when a person opens the ticket.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - staff
        - manager
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ConsoleTicketId'
      responses:
        '200':
          description: The ticket workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketWorkspace'
              examples:
                draft-ready:
                  $ref: ./examples/getConsoleTicket/draft-ready.json
                suggestion-pending:
                  $ref: ./examples/getConsoleTicket/suggestion-pending.json
                abstained-low-confidence:
                  $ref: ./examples/getConsoleTicket/abstained-low-confidence.json
                authority-required:
                  $ref: ./examples/getConsoleTicket/authority-required.json
                ai-service-unavailable:
                  $ref: ./examples/getConsoleTicket/ai-service-unavailable.json
                manual-mode:
                  $ref: ./examples/getConsoleTicket/manual-mode.json
                awaiting-approval:
                  $ref: ./examples/getConsoleTicket/awaiting-approval.json
                escalated:
                  $ref: ./examples/getConsoleTicket/escalated.json
                closed:
                  $ref: ./examples/getConsoleTicket/closed.json
                read-only-for-staff:
                  $ref: ./examples/getConsoleTicket/read-only-for-staff.json
                llm-unavailable:
                  $ref: ./examples/getConsoleTicket/llm-unavailable.json
                pseudonymization-failed:
                  $ref: ./examples/getConsoleTicket/pseudonymization-failed.json
                intent-corrected:
                  $ref: ./examples/getConsoleTicket/intent-corrected.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/console/tickets/{ticket_id}/views:
    post:
      operationId: recordTicketView
      tags:
        - console
      summary: Record that a person opened a ticket
      description: >-
        Records that the caller opened the ticket. Roles: `staff` and `manager`, on a ticket in
        any state. The first view of the ticket starts the handling clock (`handling_started_at`,
        NFR-11). On the first view of an `open` ticket in `assisted` mode, when the current
        suggestion used another KB version than the one `ai-service` has loaded, `backend` starts
        a suggestion with the trigger `kb_version_changed`. When `ai-service` does not answer
        within `ai_service_read_timeout_ms`, the view is still recorded and no
        `kb_version_changed` suggestion is started. On every view of an `open` ticket in
        `assisted` mode whose current suggestion has a part `unavailable` with
        `ai_service_unavailable`, or a draft `llm_unavailable`, and no part `pending`, `backend`
        starts a suggestion with the trigger `retry`. A started suggestion repeats the input of
        the current one, including an intent that staff chose. A retry with the same
        `Idempotency-Key` returns `204` again and starts nothing more.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - staff
        - manager
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsoleTicketId'
      responses:
        '204':
          description: The view was recorded, or this is the original result of a retry.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRoleOrOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/console/tickets/{ticket_id}/suggestions:
    post:
      operationId: createSuggestion
      tags:
        - console
      summary: Correct the intent or retry the AI
      description: >-
        Starts a new suggestion for an `open` ticket in `assisted` mode and answers at once with
        it, `pending`; the console then polls `getConsoleTicket`. Roles: `staff` and `manager`.
        With `intent_override`, the request confirms or corrects the intent (ESC-01), also while
        a draft is generating, which cancels that draft; it needs a known intent: the analysis
        of the current suggestion is `ready`, or the current suggestion already carries an
        override. When no intent is known, it returns `409 suggestion-pending` while a part is
        `pending`, and `422` otherwise. Without `intent_override`, the request is a retry, valid
        only when `allowed_actions` contains `retry_suggestion`; otherwise it returns `422`. A
        retry repeats the input of the failed suggestion, including the intent that staff chose,
        so a failure after an intent correction keeps that intent. On a ticket that is not
        `open`, or whose handling mode is `manual`, the request returns
        `409 invalid-ticket-state`. The new suggestion supersedes the previous one, and the
        authority flag stays as it is (contracts v1 design, authority rule). A retry with the
        same `Idempotency-Key` and body returns the original `202` and starts no second
        suggestion.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - staff
        - manager
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsoleTicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSuggestionRequest'
      responses:
        '202':
          description: >-
            The new suggestion, `pending`, or the original result of a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionView'
              examples:
                intent-override:
                  $ref: ./examples/createSuggestion/intent-override.json
                retry:
                  $ref: ./examples/createSuggestion/retry.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRoleOrOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SuggestionConflict'
        '422':
          $ref: '#/components/responses/InvalidSuggestionRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/console/tickets/{ticket_id}/reply-proposals:
    post:
      operationId: createReplyProposal
      tags:
        - console
      summary: Submit a reply for a manager to send
      description: >-
        Stores a reply that staff prepared and moves the ticket from `open` to
        `awaiting_approval`, where a manager sends it as proposed or edited (FR-06). Role:
        `staff`. Nothing reaches the customer. The checks run in this order and the first
        failure answers: the `Origin` header, the session, and the role; the ticket exists; the
        `Idempotency-Key`; the ticket is `open` (`409 invalid-ticket-state`); no part of the
        current suggestion is `pending` (`409 suggestion-pending`); a `suggestion_id` names the
        current suggestion (`409 suggestion-superseded`); then the body rules of the basis
        (`422`). A retry with the same `Idempotency-Key` and body returns the original `201`.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - staff
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsoleTicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReplyProposalRequest'
      responses:
        '201':
          description: The proposal was stored, or this is the original result of a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyProposalView'
              examples:
                from-ai-draft:
                  $ref: ./examples/createReplyProposal/from-ai-draft.json
                without-ai-draft:
                  $ref: ./examples/createReplyProposal/without-ai-draft.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRoleOrOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReplyConflict'
        '422':
          $ref: '#/components/responses/InvalidReply'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/console/tickets/{ticket_id}/replies:
    post:
      operationId: sendReply
      tags:
        - console
      summary: Send the reply to the customer
      description: >-
        Sends the reply that staff or a manager wrote or approved, and closes the ticket. This
        is the only operation that sends anything to a customer, and it always needs this staff
        action (FR-04). Roles: `staff`, on an `open` ticket that does not require authority, and
        `manager`, on every ticket that is not `closed`. On an `awaiting_approval` ticket the
        basis is `reply_proposal`. The checks run in this order and the first failure answers:
        the `Origin` header, the session, and the role; the ticket exists; the
        `Idempotency-Key`; the ticket is not `closed` (`409 invalid-ticket-state`); `staff` act
        only on an `open` ticket (`403 forbidden`); `staff` never send on a ticket that requires
        authority (`403 authority-required`, FR-06); no part of the current suggestion is
        `pending` (`409 suggestion-pending`); a `suggestion_id` names the current suggestion
        (`409 suggestion-superseded`); then the body rules of the basis (`422`). A body that
        contains a placeholder is refused, so no placeholder reaches a customer (SEC-38). The
        reply is sent at most once: a retry with the same `Idempotency-Key` and body returns the
        original `201` (ERR-16). `frontend` never retries this operation automatically (TS-29).
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - staff
        - manager
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsoleTicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendReplyRequest'
      responses:
        '201':
          description: The reply was sent, or this is the original result of a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleReplyView'
              examples:
                from-ai-draft:
                  $ref: ./examples/sendReply/from-ai-draft.json
                from-reply-proposal:
                  $ref: ./examples/sendReply/from-reply-proposal.json
                without-ai-draft:
                  $ref: ./examples/sendReply/without-ai-draft.json
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRoleOriginOrAuthority'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReplyConflict'
        '422':
          $ref: '#/components/responses/InvalidReply'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/console/tickets/{ticket_id}/escalations:
    post:
      operationId: createEscalation
      tags:
        - console
      summary: Move a ticket to a manager
      description: >-
        Escalates an `open` ticket to the manager queue with at least one staff reason code
        (ADR-0006), and records the staff decision `escalate`. Role: `staff`. The AI only
        recommends an escalation; this staff action decides it. Staff may escalate while a
        suggestion part is `pending`. The checks run in this order and the first failure
        answers: the `Origin` header, the session, and the role; the ticket exists; the
        `Idempotency-Key`; the ticket is `open` (`409 invalid-ticket-state`); a `suggestion_id`
        names the current suggestion (`409 suggestion-superseded`); then the body rules (`422`).
        A retry with the same `Idempotency-Key` and body returns the original `201`.
      security:
        - sessionCookie: []
      x-supportiq-roles:
        - staff
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConsoleTicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEscalationRequest'
      responses:
        '201':
          description: The ticket was escalated, or this is the original result of a retry.
          content:
