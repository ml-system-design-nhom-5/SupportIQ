        '403':
          $ref: '#/components/responses/ForbiddenRoleOrOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EscalationConflict'
        '422':
          $ref: '#/components/responses/InvalidEscalation'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/NotReady'
  /v1/console/kb-documents/{document_id}/versions/{version}:
