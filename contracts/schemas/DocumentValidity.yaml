description: >-
  Whether a KB document version may support a reply at `as_of`. A version is in effect when
  `effective_start_at` is at or before `as_of` and `as_of` is before `effective_end_at`, or the
  version has no `effective_end_at`.
  `valid`: the version is in effect, and no other version in effect with the same policy key
  disagrees with it.
  `expired`: the version's effective period ended at or before `as_of`. A version whose effective
  period starts after `as_of` is never returned.
  `conflicting`: the version is in effect, but another version in effect with the same policy key
  disagrees with it (DATA-19, `conflicting_sources`).
  Consumers map an unknown value to `expired`, so the version is never presented as usable
  (CON-22). Data class: Internal.
type: string
enum:
  - valid
  - expired
  - conflicting
