description: >-
  The name of one field of `OrderContext`: the closed list of order facts that a draft may cite
  (ADR-0014, statement 1). It names a field and never carries its value. Consumers ignore a
  citation with an unknown value (CON-22). Data class: Internal.
type: string
enum:
  - order_status
  - placed_at
  - order_total
  - shipping_cost
  - shipment_status
  - estimated_delivery_at
  - delivered_at
  - refund_status
  - refund_amount
  - refund_requested_at
