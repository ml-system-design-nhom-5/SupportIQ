description: >-
  Time spent by `ai-service` on one call, in milliseconds, for the developer details of the
  console (UI-35) and for tuning the step budgets (ERR-10). Data class: Internal.
type: object
required:
  - total_ms
  - analysis_ms
properties:
  total_ms:
    description: >-
      From receiving the request to sending the response, in milliseconds. Data class:
      Internal.
    type: integer
    minimum: 0
    maximum: 60000
  analysis_ms:
    description: >-
      Classification, retrieval, the validity filter, reranking, and routing, in
      milliseconds. Data class: Internal.
    type: integer
    minimum: 0
    maximum: 60000
  llm_ms:
    description: >-
      The LLM step, retries and output checks included, in milliseconds; its budget is at
      most 10 000 ms (NFR-07). Absent when the call made no LLM request. Data class:
      Internal.
    type: integer
    minimum: 0
    maximum: 60000
