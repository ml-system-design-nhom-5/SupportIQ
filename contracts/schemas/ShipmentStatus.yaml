description: >-
  The status of the shipment of a simulated order.
  `not_shipped`: the parcel has not been handed to the carrier.
  `in_transit`: the carrier has the parcel and it is on its way.
  `delivered`: the carrier delivered the parcel.
  `delayed`: the carrier reported a delay and the parcel has not arrived.
  `lost`: the carrier reported the parcel lost.
  Consumers map an unknown value to a neutral presentation (CON-22).
  Data class: that of the property holding this value.
type: string
enum:
  - not_shipped
  - in_transit
  - delivered
  - delayed
  - lost
