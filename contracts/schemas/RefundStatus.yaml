description: >-
  The status of the refund of a simulated order (`synthetic-dev-only` commerce
  data).
  `requested`: the customer asked for a refund and nobody has reviewed it.
  `under_review`: the request is being reviewed.
  `approved`: the refund was approved and is not paid yet.
  `rejected`: the refund was refused.
  `paid`: the refund amount was paid to the customer.
  Consumers map an unknown value to a neutral presentation (CON-22).
  Data class: that of the property holding this value.
type: string
enum:
  - requested
  - under_review
  - approved
  - rejected
  - paid
