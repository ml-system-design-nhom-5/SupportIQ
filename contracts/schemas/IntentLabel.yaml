description: >-
  One of the 46 Bitext intent labels: what the customer wants. The 12 in-scope intents are
  `track_order`, `cancel_order`, `delivery_time`, `delivery_issue`, `shipping_costs`,
  `return_policy`, `return_product`, `refund_policy`, `request_refund`, `refund_status`,
  `payment_issue`, and `human_agent` (requirements §3.2); every other label is out of scope
  (ESC-02). Consumers map an unknown value to an unspecified intent (CON-22). Data class:
  Internal.
type: string
