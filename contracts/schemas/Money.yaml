description: >-
  An amount of money as an integer in minor units with its currency (CON-16).
  Floating-point amounts are never used. Data class: that of the property
  holding this value.
type: object
required:
  - amount_minor
  - currency
properties:
  amount_minor:
    description: >-
      The amount in the minor unit of `currency`, as ISO 4217 defines it: cents
      for `USD`, and whole dong for `VND`, which has no minor unit. Never
      negative. At most 9 007 199 254 740 991, the largest integer that a
      JavaScript number holds exactly. Data class: that of the property holding
      this value.
    type: integer
    minimum: 0
    maximum: 9007199254740991
  currency:
    description: >-
      The ISO 4217 alphabetic currency code, three uppercase letters, for
      example `USD`. Data class: that of the property holding this value.
    type: string
    pattern: '^[A-Z]{3}$'
