description: >-
  A coarse reading of the calibrated probability of the model's top intent, computed by
  `ai-service` so that no consumer applies a threshold itself.
  `low`: the routing carries `low_confidence`, because the top probability is below τ or the gap
  between the top two probabilities is below δ (ESC-01).
  `medium`: the probability passed τ and δ and is below the high-band threshold.
  `high`: the probability passed τ and δ and reaches the high-band threshold.
  The `ai-service` pipeline design sets the high-band threshold. A staff-chosen intent has no
  band. Consumers map an unknown value to `low` (CON-22). Data class: Internal.
type: string
enum:
  - high
  - medium
  - low
