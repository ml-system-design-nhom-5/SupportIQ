description: >-
  A citation of one field of the order context that `backend` sent with the request. It supports
  only a fact held in that field, and is never evidence for a policy, an eligibility, a
  conclusion, or routing (ADR-0014, statements 2 and 3). It names the field and never carries its
  value, so no personal value leaves `ai-service` (ADR-0014, statement 5). Data class: Internal.
type: object
required:
  - source_type
  - citation_id
  - field
properties:
  source_type:
    description: >-
      The kind of source: always `order_context` in this variant. Data class: Internal.
    type: string
    enum:
      - order_context
  citation_id:
    $ref: './AiItemId.yaml'
    description: >-
      The identifier of the citation, unique among the citations of the draft. Segments refer to
      it in `citation_ids`. Data class: Internal.
  field:
    $ref: './OrderContextField.yaml'
    description: >-
      The cited field. It is present in the `order_context` of the request, and every segment
      that cites it agrees with its value; otherwise there is no draft and the reason code is
      `grounding_failed` (ADR-0014, statement 4). Data class: Internal.
