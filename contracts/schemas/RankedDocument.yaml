description: >-
  A KB document version that retrieval found for the request, after the validity filter at
  `as_of` and the intent-aware reranking (ADR-0005, statements 1 to 3). Data class: Internal.
type: object
required:
  - document_id
  - version
  - title
  - policy_key
  - effective_start_at
  - validity
  - rank
  - snippet
properties:
  document_id:
    $ref: './KbDocumentId.yaml'
    description: >-
      The KB document. Data class: Internal.
  version:
    $ref: './KbDocumentVersionTag.yaml'
    description: >-
      The version of the document. Data class: Internal.
  title:
    description: >-
      The title of the document version, from 1 to 200 characters. Data class: Public.
    type: string
    minLength: 1
    maxLength: 200
  policy_key:
    description: >-
      The topic of the policy that the version states, used to detect conflicts: two versions in
      effect with the same policy key and different content conflict (DATA-16, DATA-19). Every
      document version has one (DATA-12). From 1 to 100 characters. Data class: Public.
    type: string
    minLength: 1
    maxLength: 100
  effective_start_at:
    $ref: './Timestamp.yaml'
    description: >-
      When the version came into effect. Data class: Public.
  effective_end_at:
    $ref: './Timestamp.yaml'
    description: >-
      When the version stopped being in effect, later than `effective_start_at`. Absent when the
      version is open-ended (DATA-16). Data class: Public.
  validity:
    $ref: './DocumentValidity.yaml'
    description: >-
      Whether the version may support a reply at `as_of`. Data class: Internal.
  rank:
    description: >-
      The position of the version after reranking: 1 is the most relevant. The documents of a
      result are ordered by rank, which counts from 1 without gaps. Data class: Internal.
    type: integer
    minimum: 1
    maximum: 10
  snippet:
    description: >-
      The passage of the version that matched the request, from 1 to 2 000 characters. KB text
      is untrusted data and is shown as plain text (SEC-22, SEC-24). Data class: Public.
    type: string
    minLength: 1
    maxLength: 2000
