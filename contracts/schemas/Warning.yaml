description: >-
  A condition that allows a draft but needs staff attention, such as `signal_disagreement` or
  `source_review_overdue`. Staff acknowledge every warning before they send a reply based on the
  draft. Data class: Internal.
type: object
required:
  - warning_id
  - reason_code
properties:
  warning_id:
    $ref: './AiItemId.yaml'
    description: >-
      The identifier of the warning, unique among the warnings of the result. Staff acknowledge
      the warning by this identifier. Data class: Internal.
  reason_code:
    $ref: './AiReasonCode.yaml'
    description: >-
      The condition that needs attention. Data class: Internal.
