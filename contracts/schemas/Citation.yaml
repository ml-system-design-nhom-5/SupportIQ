description: >-
  A link from a draft segment to its source, discriminated by `source_type` (ADR-0014): a KB
  document version (`kb_document`) or one field of the order context (`order_context`). Consumers
  ignore a citation with an unknown `source_type` and show its segments without that source
  (CON-22). Data class: Internal.
oneOf:
  - $ref: './KbDocumentCitation.yaml'
  - $ref: './OrderContextCitation.yaml'
discriminator:
  propertyName: source_type
  mapping:
    kb_document: './KbDocumentCitation.yaml'
    order_context: './OrderContextCitation.yaml'
