description: >-
  The release that `ai-service` serves and the version of each asset it names (DATA-56). One
  release manifest is loaded at startup and serves every request until the next start, so every
  suggestion can be reproduced from these values. Data class: Internal.
type: object
required:
  - release_id
  - model_version
  - kb_version
  - mapping_version
  - prompt_version
  - routing_version
  - index_version
properties:
  release_id:
    description: >-
      The unique, immutable identifier of the release manifest that produced the result. Opaque
      (CON-15). From 1 to 64 characters: ASCII letters, digits, `.`, `_`, and `-`, starting with a
      letter or a digit. Data class: Internal.
    type: string
    minLength: 1
    maxLength: 64
    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
  model_version:
    $ref: './AssetVersion.yaml'
    description: >-
      The version of the intent classification model artifact. Data class: Internal.
  kb_version:
    $ref: './AssetVersion.yaml'
    description: >-
      The version of the KB: the immutable set of KB document versions that retrieval searches
      (DATA-17). Data class: Internal.
  mapping_version:
    $ref: './AssetVersion.yaml'
    description: >-
      The version of the document-to-intent mapping used for reranking (ADR-0005, statement 6;
      DATA-18). Data class: Internal.
  prompt_version:
    $ref: './AssetVersion.yaml'
    description: >-
      The version of the set of prompts that drafting uses. Data class: Internal.
  routing_version:
    $ref: './AssetVersion.yaml'
    description: >-
      The version of the routing configuration: τ, δ, the rerank weight λ, the sensitive intents,
      and the sensitive-term list (DATA-58). Data class: Internal.
  index_version:
    $ref: './AssetVersion.yaml'
    description: >-
      The version of the retrieval index built from the KB version. Data class: Internal.
