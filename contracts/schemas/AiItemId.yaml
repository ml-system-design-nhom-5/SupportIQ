description: >-
  The identifier of one item of an `ai-service` result: a draft segment, a citation, or a
  warning. It is unique among the items of its kind within one result, and means nothing outside
  it. Opaque (CON-15). From 1 to 64 characters: ASCII letters, digits, `.`, `_`, and `-`, starting
  with a letter or a digit. Data class: Internal.
type: string
minLength: 1
maxLength: 64
pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
