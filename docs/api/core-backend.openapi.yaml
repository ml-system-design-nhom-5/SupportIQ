components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "15-minute access token. Backend also verifies active session and effective role."
    RefreshCookie:
      type: "apiKey"
      in: "cookie"
      name: "refresh_token"
      description: "Rotating 8-hour HttpOnly Secure SameSite=Strict refresh token; request Origin and X-CSRF-Token are checked."
    InternalService: {"type":"http","scheme":"bearer","description":"Internal-only service authentication; public gateway denies these routes."}
  parameters:
    TicketId:
      name: "ticket_id"
      in: "path"
      required: true
      description: "Ticket UUID; access is checked against role, ownership, queue and assignment."
      schema: {"type":"string","format":"uuid"}
    Cursor:
      name: "cursor"
      in: "query"
      description: "Opaque server cursor; it does not grant access."
      schema: {"type":"string","maxLength":1024}
    Limit:
      name: "limit"
      in: "query"
      description: "Maximum number of returned records."
      schema: {"type":"integer","minimum":1,"maximum":100,"default":20}
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "Random key, scoped to actor/method/route for 24 hours. Replay rechecks authorization before returning the same resource."
      schema: {"type":"string","minLength":16,"maxLength":128}
    IfMatch:
      name: "If-Match"
      in: "header"
      required: true
      description: "Quoted current ticket.version, e.g. \"7\". Required for ticket-scoped mutations; checked after an authorized idempotent replay."
      schema: {"type":"string","pattern":"^\"[1-9][0-9]*\"$"}
    CsrfToken:
      name: "X-CSRF-Token"
      in: "header"
      required: true
      description: "Session CSRF token; also validate the request Origin."
      schema: {"type":"string"}
  responses:
    BadRequest:
      description: "400: invalid_request. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
    Unauthorized:
      description: "401: unauthenticated. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
      headers: {"WWW-Authenticate":{"description":"Bearer challenge.","schema":{"type":"string"}}}
    Forbidden:
      description: "403: forbidden. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
    NotFound:
      description: "404: not_found. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
    Conflict:
      description: "409: state_conflict, evidence_changed, idempotency_conflict, release_not_approved. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
    PreconditionFailed:
      description: "412: version_conflict. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
    PayloadTooLarge:
      description: "413: payload_too_large. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
    UnsupportedMediaType:
      description: "415: unsupported_media_type. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
    ValidationFailed:
      description: "422: validation_failed. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
    PreconditionRequired:
      description: "428: precondition_required. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
    RateLimited:
      description: "429: rate_limited. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
      headers: {"Retry-After":{"description":"Delay in seconds when retry is appropriate.","schema":{"type":"integer","minimum":1}}}
    InternalError:
      description: "500: internal_error. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
    Unavailable:
      description: "503: dependency_unavailable, ai_unavailable, rate_limiter_unavailable. Details and validation errors never echo sensitive input."
      content: {"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}}
      headers: {"Retry-After":{"description":"Delay in seconds when retry is appropriate.","schema":{"type":"integer","minimum":1}}}
  schemas:
    Pagination:
      type: "object"
      additionalProperties: false
      required: ["next_cursor","has_more"]
      properties: {"next_cursor":{"anyOf":[{"type":"string"},{"type":"null"}]},"has_more":{"type":"boolean"}}
    User:
      type: "object"
      additionalProperties: false
      required: ["id","role","active","role_version"]
      properties:
        id: {"type":"string","format":"uuid"}
        role: {"type":"string","enum":["customer","agent","manager","admin"]}
        active: {"type":"boolean"}
        role_version: {"type":"integer","minimum":1}
    Login:
      type: "object"
      additionalProperties: false
      required: ["email","password"]
      properties:
        email: {"type":"string","format":"email","maxLength":254}
        password: {"type":"string","format":"password","minLength":1,"maxLength":256,"writeOnly":true}
    Session:
      type: "object"
      additionalProperties: false
      required: ["access_token","token_type","expires_in","csrf_token","user"]
      properties:
        access_token: {"type":"string"}
        token_type: {"type":"string","const":"Bearer"}
        expires_in: {"type":"integer","const":900}
        csrf_token: {"type":"string"}
        user: {"$ref":"#/components/schemas/User"}
    TicketCreate:
      type: "object"
      additionalProperties: false
      required: ["message"]
      properties: {"message":{"type":"string","minLength":1,"maxLength":8000},"order_id":{"type":"string","format":"uuid"}}
    Ticket:
      type: "object"
      additionalProperties: false
      description: "Customer receives metadata only, omitting current_run_id/current_decision_id. Staff responses always include both nullable pointers for REST recovery."
      required: ["id","status","handling_queue","manual_required","assignee_id","order_id","version","context_version","created_at","updated_at"]
      properties:
        id: {"type":"string","format":"uuid"}
        status: {"type":"string","enum":["open","resolved","closed"]}
        handling_queue: {"type":"string","enum":["standard","manager"]}
        manual_required: {"type":"boolean"}
        assignee_id: {"anyOf":[{"type":"string","format":"uuid"},{"type":"null"}]}
        order_id: {"anyOf":[{"type":"string","format":"uuid"},{"type":"null"}]}
        version: {"type":"integer","minimum":1}
        context_version: {"type":"integer","minimum":1}
        current_run_id: {"anyOf":[{"type":"string","format":"uuid"},{"type":"null"}],"readOnly":true,"description":"Staff only; the current run may be superseded. Read its status before review."}
        current_decision_id: {"anyOf":[{"type":"string","format":"uuid"},{"type":"null"}],"readOnly":true,"description":"Staff only; only this decision can authorize send if action is approve/edit. Cleared by context/regeneration/assignment/queue/close/send changes."}
        created_at: {"type":"string","format":"date-time"}
        updated_at: {"type":"string","format":"date-time"}
    TicketUpdate:
      type: "object"
      additionalProperties: false
      required: []
      properties:
        assignee_id: {"anyOf":[{"type":"string","format":"uuid"},{"type":"null"}]}
        status: {"type":"string","enum":["open","resolved","closed"]}
      minProperties: 1
      description: "Agent may claim an unassigned standard ticket or update their assigned standard ticket. Only Manager may reassign or modify manager-queue tickets. No queue or AI state can be set directly."
    MessageCreate:
      type: "object"
      additionalProperties: false
      required: ["body"]
      properties: {"body":{"type":"string","minLength":1,"maxLength":8000}}
    Message:
      type: "object"
      additionalProperties: false
      required: ["id","ticket_id","direction","body","created_at"]
      properties:
        id: {"type":"string","format":"uuid"}
        ticket_id: {"type":"string","format":"uuid"}
        direction: {"type":"string","enum":["inbound","outbound"]}
        body: {"type":"string","maxLength":8000}
        created_at: {"type":"string","format":"date-time"}
    RunCreate:
      type: "object"
      additionalProperties: false
      required: []
      properties: {"intent_override":{"type":"string","maxLength":100},"reason":{"type":"string","minLength":1,"maxLength":1000}}
      dependentRequired: {"intent_override":["reason"]}
    ReasonCode:
      type: "string"
      enum:
        - "low_confidence"
        - "ambiguous_request"
        - "unsupported_intent"
        - "human_requested"
        - "sensitive_request"
        - "agent_escalated"
        - "missing_information"
        - "no_evidence"
        - "expired_evidence"
        - "conflicting_evidence"
        - "ml_unavailable"
        - "retrieval_unavailable"
        - "llm_unavailable"
        - "pipeline_timeout"
        - "privacy_check_failed"
        - "invalid_model_output"
        - "invalid_llm_output"
        - "release_mismatch"
    RunAccepted:
      type: "object"
      additionalProperties: false
      required: ["id","ticket_id","status","context_version","reason_codes"]
      properties:
        id: {"type":"string","format":"uuid"}
        ticket_id: {"type":"string","format":"uuid"}
        status: {"type":"string","enum":["queued"]}
        context_version: {"type":"integer","minimum":1}
        reason_codes: {"type":"array","items":{"$ref":"#/components/schemas/ReasonCode"}}
    Run:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "ticket_id"
        - "status"
        - "context_version"
        - "release_id"
        - "predicted_intent"
        - "final_intent"
        - "confidence"
        - "reason_codes"
        - "draft"
        - "evidence"
        - "created_at"
        - "deadline_at"
      properties:
        id: {"type":"string","format":"uuid"}
        ticket_id: {"type":"string","format":"uuid"}
        status: {"type":"string","enum":["queued","running","awaiting_review","escalated","superseded"]}
        context_version: {"type":"integer","minimum":1}
        release_id: {"type":"string","format":"uuid"}
        predicted_intent: {"anyOf":[{"type":"string"},{"type":"null"}]}
        final_intent: {"anyOf":[{"type":"string"},{"type":"null"}]}
        confidence: {"anyOf":[{"type":"number","minimum":0,"maximum":1},{"type":"null"}]}
        reason_codes: {"type":"array","items":{"$ref":"#/components/schemas/ReasonCode"}}
        draft: {"anyOf":[{"$ref":"#/components/schemas/Draft"},{"type":"null"}]}
        evidence: {"type":"array","items":{"$ref":"#/components/schemas/Evidence"}}
        created_at: {"type":"string","format":"date-time"}
        deadline_at: {"type":"string","format":"date-time"}
    Draft:
      type: "object"
      additionalProperties: false
      required: ["id","body","citation_ids","prompt_version","model_version","created_at"]
      properties:
        id: {"type":"string","format":"uuid"}
        body: {"type":"string","maxLength":8000}
        citation_ids: {"type":"array","items":{"type":"string"}}
        prompt_version: {"type":"string"}
        model_version: {"type":"string"}
        created_at: {"type":"string","format":"date-time"}
    Evidence:
      type: "object"
      additionalProperties: false
      required: ["citation_id","type","source_id","source_version","excerpt","content_hash","valid_from","valid_to","observed_at","warnings"]
      properties:
        citation_id: {"type":"string"}
        type: {"type":"string","enum":["knowledge","business"]}
        source_id: {"type":"string"}
        source_version: {"type":"string"}
        excerpt: {"type":"string"}
        content_hash: {"type":"string"}
        valid_from: {"anyOf":[{"type":"string","format":"date-time"},{"type":"null"}]}
        valid_to: {"anyOf":[{"type":"string","format":"date-time"},{"type":"null"}]}
        observed_at: {"type":"string","format":"date-time"}
        warnings: {"type":"array","items":{"type":"string"}}
    AiApproval:
      type: "object"
      additionalProperties: false
      required: ["source","action","draft_id"]
      properties:
        source: {"type":"string","const":"ai"}
        action: {"type":"string","const":"approve"}
        draft_id: {"type":"string","format":"uuid"}
        final_intent: {"type":"string","maxLength":100}
        feedback: {"type":"string","maxLength":1000}
    AiEdit:
      type: "object"
      additionalProperties: false
      required: ["source","action","draft_id","body","reason"]
      properties:
        source: {"type":"string","const":"ai"}
        action: {"type":"string","const":"edit"}
        draft_id: {"type":"string","format":"uuid"}
        body: {"type":"string","minLength":1,"maxLength":8000}
        reason: {"type":"string","minLength":1,"maxLength":1000}
        final_intent: {"type":"string","maxLength":100}
        feedback: {"type":"string","maxLength":1000}
    AiRejection:
      type: "object"
      additionalProperties: false
      required: ["source","action","draft_id","reason"]
      properties:
        source: {"type":"string","const":"ai"}
        action: {"type":"string","const":"reject"}
        draft_id: {"type":"string","format":"uuid"}
        reason: {"type":"string","minLength":1,"maxLength":1000}
        feedback: {"type":"string","maxLength":1000}
    ManualApproval:
      type: "object"
      additionalProperties: false
      required: ["source","action","body","reason"]
      properties:
        source: {"type":"string","const":"manual"}
        action: {"type":"string","const":"approve"}
        body: {"type":"string","minLength":1,"maxLength":8000}
        reason: {"type":"string","minLength":1,"maxLength":1000}
        final_intent: {"type":"string","maxLength":100}
        feedback: {"type":"string","maxLength":1000}
    Escalation:
      type: "object"
      additionalProperties: false
      required: ["source","action","reason"]
      properties:
        source: {"type":"string","enum":["ai","manual"]}
        action: {"type":"string","const":"escalate"}
        reason: {"type":"string","minLength":1,"maxLength":1000}
        feedback: {"type":"string","maxLength":1000}
    DecisionCreate:
      oneOf:
        - {"$ref":"#/components/schemas/AiApproval"}
        - {"$ref":"#/components/schemas/AiEdit"}
        - {"$ref":"#/components/schemas/AiRejection"}
        - {"$ref":"#/components/schemas/ManualApproval"}
        - {"$ref":"#/components/schemas/Escalation"}
      description: "AI approval/edit/rejection requires the current draft. Manual approval does not depend on AI. An edit is a terminal review decision, not an in-place draft mutation. No action sends a reply."
    Decision:
      type: "object"
      additionalProperties: false
      required: ["id","ticket_id","source","action","context_version","draft_id","final_intent","final_body","reason","reviewer_id","created_at"]
      properties:
        id: {"type":"string","format":"uuid"}
        ticket_id: {"type":"string","format":"uuid"}
        source: {"type":"string","enum":["ai","manual"]}
        action: {"type":"string","enum":["approve","edit","reject","escalate"]}
        context_version: {"type":"integer","minimum":1}
        draft_id: {"anyOf":[{"type":"string","format":"uuid"},{"type":"null"}]}
        final_intent: {"anyOf":[{"type":"string"},{"type":"null"}]}
        final_body: {"anyOf":[{"type":"string","maxLength":8000},{"type":"null"}]}
        reason: {"anyOf":[{"type":"string","maxLength":1000},{"type":"null"}]}
        reviewer_id: {"type":"string","format":"uuid"}
        created_at: {"type":"string","format":"date-time"}
    ReplyCreate:
      type: "object"
      additionalProperties: false
      required: ["decision_id"]
      properties: {"decision_id":{"type":"string","format":"uuid"}}
    Reply:
      type: "object"
      additionalProperties: false
      required: ["id","ticket_id","decision_id","body","created_at"]
      properties:
        id: {"type":"string","format":"uuid"}
        ticket_id: {"type":"string","format":"uuid"}
        decision_id: {"type":"string","format":"uuid"}
        body: {"type":"string","maxLength":8000}
        created_at: {"type":"string","format":"date-time"}
    AuditEvent:
      type: "object"
      additionalProperties: false
      required: ["id","event_type","request_id","ticket_id","run_id","actor_id","occurred_at","details"]
      properties:
        id: {"type":"string","format":"uuid"}
        event_type: {"type":"string"}
        request_id: {"type":"string","format":"uuid"}
        ticket_id: {"type":"string","format":"uuid"}
        run_id: {"anyOf":[{"type":"string","format":"uuid"},{"type":"null"}]}
        actor_id: {"anyOf":[{"type":"string","format":"uuid"},{"type":"null"}]}
        occurred_at: {"type":"string","format":"date-time"}
        details:
          type: "object"
          additionalProperties: true
          description: "Allowlisted sanitized metadata only; no raw question, credentials, PII or external provider body."
    Product:
      type: "object"
      additionalProperties: false
      required: ["id","name","unit_price_minor","currency"]
      properties:
        id: {"type":"string","format":"uuid"}
        name: {"type":"string"}
        unit_price_minor: {"type":"integer","minimum":0}
        currency: {"type":"string","pattern":"^[A-Z]{3}$","example":"USD"}
    OrderItemCreate:
      type: "object"
      additionalProperties: false
      required: ["product_id","quantity"]
      properties: {"product_id":{"type":"string","format":"uuid"},"quantity":{"type":"integer","minimum":1,"maximum":20}}
    OrderCreate:
      type: "object"
      additionalProperties: false
      required: ["items"]
      properties: {"items":{"type":"array","minItems":1,"maxItems":20,"items":{"$ref":"#/components/schemas/OrderItemCreate"}}}
    Order:
      type: "object"
      additionalProperties: false
      required: ["id","status","total_minor","currency","version","shipping_status","refund_status","created_at","demo"]
      properties:
        id: {"type":"string","format":"uuid"}
        status: {"type":"string","enum":["placed","shipped","delivered","cancelled"]}
        total_minor: {"type":"integer","minimum":0}
        currency: {"type":"string","pattern":"^[A-Z]{3}$","example":"USD"}
        version: {"type":"integer","minimum":1}
        shipping_status: {"anyOf":[{"type":"string"},{"type":"null"}]}
        refund_status: {"anyOf":[{"type":"string"},{"type":"null"}]}
        created_at: {"type":"string","format":"date-time"}
        demo: {"type":"boolean","const":true}
    UserUpdate:
      type: "object"
      additionalProperties: false
      required: []
      properties: {"role":{"type":"string","enum":["customer","agent","manager","admin"]},"active":{"type":"boolean"}}
      minProperties: 1
      description: "Immediately revoke affected sessions/permissions; cannot deactivate or demote the final active Admin. No access to user ticket bodies is implied."
    Release:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "model_version"
        - "prompt_version"
        - "policy_version"
        - "knowledge_version"
        - "index_version"
        - "business_version"
        - "checksum"
        - "offline_gate"
        - "approved_by"
        - "active"
        - "revoked"
      properties:
        id: {"type":"string","format":"uuid"}
        model_version: {"type":"string"}
        prompt_version: {"type":"string"}
        policy_version: {"type":"string"}
        knowledge_version: {"type":"string"}
        index_version: {"type":"string"}
        business_version: {"type":"string"}
        checksum: {"type":"string"}
        offline_gate: {"type":"string","enum":["passed","failed","pending"]}
        approved_by: {"anyOf":[{"type":"string","format":"uuid"},{"type":"null"}]}
        active: {"type":"boolean"}
        revoked: {"type":"boolean"}
    ReleaseActivation:
      type: "object"
      additionalProperties: false
      required: ["release_id","expected_current_release_id"]
      properties:
        release_id: {"type":"string","format":"uuid"}
        expected_current_release_id: {"anyOf":[{"type":"string","format":"uuid"},{"type":"null"}]}
    Health:
      type: "object"
      additionalProperties: false
      required: ["status","ai_available"]
      properties: {"status":{"type":"string","enum":["ok","unavailable"]},"ai_available":{"type":"boolean"}}
    Problem:
      type: "object"
      additionalProperties: false
      required: ["type","title","status","code","request_id"]
      properties:
        type: {"type":"string","format":"uri","description":"Stable URI: urn:supportiq:problem:<code>."}
        title: {"type":"string"}
        status: {"type":"integer","minimum":400,"maximum":599}
        detail: {"type":"string"}
        code: {"type":"string"}
        request_id: {"type":"string","format":"uuid"}
        errors:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required: ["field","message"]
            properties: {"field":{"type":"string"},"message":{"type":"string"}}
    Report:
      type: "object"
      additionalProperties: false
      required:
        - "from"
        - "to"
        - "generated_at"
        - "completed_runs"
        - "reviewed_drafts"
        - "replies"
        - "ai_review_counts"
        - "escalations"
        - "staff_escalations"
        - "error_rate"
        - "ai_latency_ms"
        - "cost"
      properties:
        from: {"type":"string","format":"date-time"}
        to: {"type":"string","format":"date-time"}
        generated_at: {"type":"string","format":"date-time"}
        completed_runs: {"type":"integer","minimum":0}
        reviewed_drafts: {"type":"integer","minimum":0}
        replies: {"type":"integer","minimum":0}
        ai_review_counts:
          type: "object"
          additionalProperties: false
          required: ["approved","edited","rejected"]
          properties: {"approved":{"type":"integer","minimum":0},"edited":{"type":"integer","minimum":0},"rejected":{"type":"integer","minimum":0}}
        escalations:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required: ["reason_code","run_count"]
            properties: {"reason_code":{"$ref":"#/components/schemas/ReasonCode"},"run_count":{"type":"integer","minimum":0}}
        staff_escalations: {"type":"integer","minimum":0}
        error_rate: {"type":"number","minimum":0,"maximum":1}
        ai_latency_ms:
          type: "object"
          additionalProperties: false
          required: ["p50","p95"]
          properties: {"p50":{"anyOf":[{"type":"number","minimum":0},{"type":"null"}]},"p95":{"anyOf":[{"type":"number","minimum":0},{"type":"null"}]}}
        cost:
          type: "object"
          additionalProperties: false
          required: ["currency","known_total_micro","known_average_per_run_micro","unknown_runs","known_coverage"]
          properties:
            currency: {"type":"string"}
            known_total_micro: {"type":"integer","minimum":0}
            known_average_per_run_micro: {"anyOf":[{"type":"integer","minimum":0},{"type":"null"}]}
            unknown_runs: {"type":"integer","minimum":0}
            known_coverage: {"type":"number","minimum":0,"maximum":1}
    UserResponse: {"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/User"}}}
    SessionResponse: {"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/Session"}}}
    TicketResponse: {"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/Ticket"}}}
    MessageResponse: {"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/Message"}}}
    RunAcceptedResponse:
      type: "object"
      additionalProperties: false
      required: ["data"]
      properties: {"data":{"$ref":"#/components/schemas/RunAccepted"}}
    RunResponse: {"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/Run"}}}
    DecisionResponse: {"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/Decision"}}}
    DecisionPage:
      type: "object"
      additionalProperties: false
      required: ["data","pagination"]
      properties: {"data":{"type":"array","items":{"$ref":"#/components/schemas/Decision"}},"pagination":{"$ref":"#/components/schemas/Pagination"}}
    ReplyResponse: {"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/Reply"}}}
    OrderResponse: {"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/Order"}}}
    ReportResponse: {"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/Report"}}}
    ReleaseResponse: {"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/Release"}}}
    HealthResponse: {"type":"object","additionalProperties":false,"required":["data"],"properties":{"data":{"$ref":"#/components/schemas/Health"}}}
    TicketPage:
      type: "object"
      additionalProperties: false
      required: ["data","pagination"]
      properties: {"data":{"type":"array","items":{"$ref":"#/components/schemas/Ticket"}},"pagination":{"$ref":"#/components/schemas/Pagination"}}
    MessagePage:
      type: "object"
      additionalProperties: false
      required: ["data","pagination"]
      properties: {"data":{"type":"array","items":{"$ref":"#/components/schemas/Message"}},"pagination":{"$ref":"#/components/schemas/Pagination"}}
    AuditEventPage:
      type: "object"
      additionalProperties: false
      required: ["data","pagination"]
      properties:
        data: {"type":"array","items":{"$ref":"#/components/schemas/AuditEvent"}}
        pagination: {"$ref":"#/components/schemas/Pagination"}
    ProductPage:
      type: "object"
      additionalProperties: false
      required: ["data","pagination"]
      properties: {"data":{"type":"array","items":{"$ref":"#/components/schemas/Product"}},"pagination":{"$ref":"#/components/schemas/Pagination"}}
    OrderPage:
      type: "object"
      additionalProperties: false
      required: ["data","pagination"]
      properties: {"data":{"type":"array","items":{"$ref":"#/components/schemas/Order"}},"pagination":{"$ref":"#/components/schemas/Pagination"}}
    UserPage:
      type: "object"
      additionalProperties: false
      required: ["data","pagination"]
      properties: {"data":{"type":"array","items":{"$ref":"#/components/schemas/User"}},"pagination":{"$ref":"#/components/schemas/Pagination"}}
    ReleasePage:
      type: "object"
      additionalProperties: false
      required: ["data","pagination"]
      properties: {"data":{"type":"array","items":{"$ref":"#/components/schemas/Release"}},"pagination":{"$ref":"#/components/schemas/Pagination"}}
x-websocket:
  path: "/api/v1/ws"
  description: "TLS; validate Origin; first auth frame with access token within 5 seconds. Never put token in URL. Subscribe only after DB-based role/object checks. Send only event/resource_id/version/occurred_at. GET resource again on reconnect; REST remains authoritative."
  events: ["ticket.changed","run.changed"]
