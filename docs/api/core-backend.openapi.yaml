openapi: "3.1.0"
info:
  title: "SupportIQ Core Backend API"
  version: "0.1.0"
  summary: "Proposed demo backend contract; no implementation is included."
  description: "Companion to the 2026-10-27 Core Backend design. English product fields and messages. Every operation enforces role and object scope; all error responses are RFC 9457 Problem Details. Public replies require an explicit staff send following approval. Generic error responses are listed consistently; individual preconditions apply only where documented. Unknown fields are rejected. Decisions, evidence, drafts and audit are immutable."
servers: [{"url":"/api/v1","description":"Same-site gateway base path."}]
tags:
  - {"name":"Auth","description":"Seeded-account authentication and session lifecycle."}
  - {"name":"Tickets","description":"Role-scoped support tickets and conversation."}
  - {"name":"AI","description":"Asynchronous AI runs; no automatic delivery."}
  - {"name":"Review","description":"Human decisions and explicit public replies."}
  - {"name":"Audit","description":"Sanitized immutable ticket event timeline."}
  - {"name":"Commerce","description":"Synthetic storefront demo only."}
  - {"name":"Reports","description":"Manager aggregates."}
  - {"name":"Administration","description":"Admin account and release management."}
  - {"name":"Operations","description":"Internal health endpoints."}
security: [{"BearerAuth":[]}]
paths:
  "/sessions":
    post:
      operationId: "createSession"
      tags: ["Auth"]
      summary: "Sign in with a seeded demo account"
      responses:
        "201":
          description: "Session created. Validate Origin; never log credentials."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/SessionResponse"}}}
          headers:
            Set-Cookie:
              description: "Set refresh_token with HttpOnly; Secure; SameSite=Strict; Path=/api/v1/sessions; Max-Age=28800. Also set session-bound csrf_token cookie with Secure; SameSite=Strict; Path=/ and no HttpOnly."
              schema: {"type":"string"}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      security: []
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Login"}}}}
  "/sessions/refresh":
    post:
      operationId: "refreshSession"
      tags: ["Auth"]
      summary: "Rotate refresh token and issue an access JWT"
      responses:
        "200":
          description: "Session rotated; response sets a replacement refresh cookie."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/SessionResponse"}}}
          headers: {"Set-Cookie":{"description":"Replacement secure HttpOnly refresh cookie.","schema":{"type":"string"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      security: [{"RefreshCookie":[]}]
      parameters: [{"$ref":"#/components/parameters/CsrfToken"}]
  "/sessions/current":
    delete:
      operationId: "deleteSession"
      tags: ["Auth"]
      summary: "Revoke the current session and clear the refresh cookie"
      responses:
        "204":
          description: "Session revoked; no response body."
          headers: {"Set-Cookie":{"description":"Clear refresh cookie with Max-Age=0.","schema":{"type":"string"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      parameters: [{"$ref":"#/components/parameters/CsrfToken"}]
  "/me":
    get:
      operationId: "getMe"
      tags: ["Auth"]
      summary: "Read current user identity and effective role"
      responses:
        "200":
          description: "Authenticated account metadata."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/UserResponse"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
  "/tickets":
    get:
      operationId: "listTickets"
      tags: ["Tickets"]
      summary: "List tickets visible to the current user"
      responses:
        "200":
          description: "Scoped ticket list; no draft, PII body or customer identifier fields."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/TicketPage"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      parameters:
        - {"$ref":"#/components/parameters/Cursor"}
        - {"$ref":"#/components/parameters/Limit"}
        -
          name: "status"
          in: "query"
          description: "Filter tickets by status within the caller's scope."
          schema: {"type":"string","enum":["open","resolved","closed"]}
        -
          name: "handling_queue"
          in: "query"
          description: "Staff-only queue filter; it cannot expand authorization."
          schema: {"type":"string","enum":["standard","manager"]}
    post:
      operationId: "createTicket"
      tags: ["Tickets"]
      summary: "Customer creates a ticket with an initial question"
      responses:
        "201":
          description: "Ticket and inbound message persisted with audit."
          headers:
            ETag: {"description":"Current ticket version after the mutation.","schema":{"type":"string"}}
            Location: {"schema":{"type":"string"},"description":"Created ticket URI."}
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/TicketResponse"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      parameters: [{"$ref":"#/components/parameters/IdempotencyKey"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TicketCreate"}}}}
  "/tickets/{ticket_id}":
    parameters: [{"$ref":"#/components/parameters/TicketId"}]
    get:
      operationId: "getTicket"
      tags: ["Tickets"]
      summary: "Read a scoped ticket"
      responses:
        "200":
          description: "Role-safe ticket metadata."
          headers: {"ETag":{"description":"Current ticket version, quoted. Use for the next ticket mutation.","schema":{"type":"string"}}}
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/TicketResponse"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
    patch:
      operationId: "updateTicket"
      tags: ["Tickets"]
      summary: "Claim, assign or update ticket status within staff authority"
      responses:
        "200":
          description: "Ticket updated with audit."
          headers: {"ETag":{"description":"Current ticket version, quoted. Use for the next ticket mutation.","schema":{"type":"string"}}}
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/TicketResponse"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      parameters: [{"$ref":"#/components/parameters/IfMatch"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TicketUpdate"}}}}
  "/tickets/{ticket_id}/messages":
    parameters: [{"$ref":"#/components/parameters/TicketId"}]
    get:
      operationId: "listMessages"
      tags: ["Tickets"]
      summary: "Read inbound customer messages and sent public replies"
      responses:
        "200":
          description: "Ordered conversation. Excludes drafts and unsent decision bodies."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/MessagePage"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      parameters: [{"$ref":"#/components/parameters/Cursor"},{"$ref":"#/components/parameters/Limit"}]
    post:
      operationId: "createMessage"
      tags: ["Tickets"]
      summary: "Customer appends a message to their ticket"
      responses:
        "201":
          description: "Message persisted; context incremented; unsent approvals and older runs become stale."
          headers: {"ETag":{"description":"Current ticket version, quoted. Use for the next ticket mutation.","schema":{"type":"string"}}}
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/MessageResponse"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      parameters: [{"$ref":"#/components/parameters/IdempotencyKey"},{"$ref":"#/components/parameters/IfMatch"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/MessageCreate"}}}}
  "/tickets/{ticket_id}/runs":
    parameters: [{"$ref":"#/components/parameters/TicketId"}]
    post:
      operationId: "createRun"
      tags: ["AI"]
      summary: "Staff requests an asynchronous AI run"
      responses:
        "202":
          description: "Run and durable job accepted. This is not a completed draft."
          headers:
            ETag: {"description":"Current ticket version after the mutation.","schema":{"type":"string"}}
            Location: {"description":"Run status URI.","schema":{"type":"string"}}
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/RunAcceptedResponse"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      parameters: [{"$ref":"#/components/parameters/IdempotencyKey"},{"$ref":"#/components/parameters/IfMatch"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RunCreate"}}}}
  "/runs/{run_id}":
    parameters:
      -
        name: "run_id"
        in: "path"
        required: true
        description: "Run UUID; staff access follows its parent ticket."
        schema: {"type":"string","format":"uuid"}
    get:
      operationId: "getRun"
      tags: ["AI"]
      summary: "Staff reads run, intent, draft, evidence and escalation reasons"
      responses:
        "200":
          description: "Staff-only run data; never available to Customer."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/RunResponse"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
  "/tickets/{ticket_id}/decisions":
    parameters: [{"$ref":"#/components/parameters/TicketId"}]
    get:
      operationId: "listDecisions"
      tags: ["Review"]
      summary: "Staff recovers review history and unsent approved responses"
      description: "Staff-only. Ticket.current_decision_id selects the only currently sendable approval; older decisions remain readable but cannot be sent. Customer has no access."
      parameters: [{"$ref":"#/components/parameters/Cursor"},{"$ref":"#/components/parameters/Limit"}]
      responses:
        "200":
          description: "Authorized decision history, including final bodies that must never be logged."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/DecisionPage"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
    post:
      operationId: "createDecision"
      tags: ["Review"]
      summary: "Record an immutable review decision without sending"
      responses:
        "201":
          description: "Decision and audit committed atomically. No public reply created."
          headers: {"ETag":{"description":"Current ticket version, quoted. Use for the next ticket mutation.","schema":{"type":"string"}}}
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/DecisionResponse"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      parameters: [{"$ref":"#/components/parameters/IdempotencyKey"},{"$ref":"#/components/parameters/IfMatch"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DecisionCreate"}}}}
  "/tickets/{ticket_id}/replies":
    parameters: [{"$ref":"#/components/parameters/TicketId"}]
    post:
      operationId: "createReply"
      tags: ["Review"]
      summary: "Staff explicitly sends an approved decision to the customer"
      responses:
        "201":
          description: "Reply published after atomic current_decision_id, scope, context, evidence and uniqueness checks plus audit. Older approvals cannot be sent."
          headers: {"ETag":{"description":"Current ticket version, quoted. Use for the next ticket mutation.","schema":{"type":"string"}}}
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/ReplyResponse"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      parameters: [{"$ref":"#/components/parameters/IdempotencyKey"},{"$ref":"#/components/parameters/IfMatch"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ReplyCreate"}}}}
  "/tickets/{ticket_id}/events":
    parameters: [{"$ref":"#/components/parameters/TicketId"}]
    get:
      operationId: "listTicketEvents"
      tags: ["Audit"]
      summary: "Staff reads a sanitized ticket audit timeline"
      responses:
        "200":
          description: "Immutable sanitized events visible within staff scope."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/AuditEventPage"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      parameters: [{"$ref":"#/components/parameters/Cursor"},{"$ref":"#/components/parameters/Limit"}]
  "/products":
    get:
      operationId: "listProducts"
      tags: ["Commerce"]
      summary: "Read the synthetic product catalog"
      responses:
        "200":
          description: "Demo products; no real payment or inventory integration."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/ProductPage"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
        "429": {"$ref":"#/components/responses/RateLimited"}
        "500": {"$ref":"#/components/responses/InternalError"}
        "503": {"$ref":"#/components/responses/Unavailable"}
      security: []
      parameters: [{"$ref":"#/components/parameters/Cursor"},{"$ref":"#/components/parameters/Limit"}]
  "/orders":
    get:
      operationId: "listOrders"
      tags: ["Commerce"]
      summary: "Customer lists their own demo orders"
      responses:
        "200":
          description: "Own orders only; staff support lookup uses the ticket-scoped endpoint."
          content: {"application/json":{"schema":{"$ref":"#/components/schemas/OrderPage"}}}
        "400": {"$ref":"#/components/responses/BadRequest"}
        "401": {"$ref":"#/components/responses/Unauthorized"}
        "403": {"$ref":"#/components/responses/Forbidden"}
        "404": {"$ref":"#/components/responses/NotFound"}
        "409": {"$ref":"#/components/responses/Conflict"}
        "412": {"$ref":"#/components/responses/PreconditionFailed"}
        "413": {"$ref":"#/components/responses/PayloadTooLarge"}
        "415": {"$ref":"#/components/responses/UnsupportedMediaType"}
        "422": {"$ref":"#/components/responses/ValidationFailed"}
        "428": {"$ref":"#/components/responses/PreconditionRequired"}
